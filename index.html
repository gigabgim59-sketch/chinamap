.cn-wrap{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;color:#3a3226;position:relative;--btn-h:36px;--btn-fs:13px}
.cn-toolbar,.cn-dyn-bar,.cn-mode-bar{display:flex;gap:6px;flex-wrap:wrap;font-size:var(--btn-fs);align-items:center;margin-bottom:6px}
.cn-toolbar button,.cn-dyn-bar button,.cn-mode-bar button{min-height:var(--btn-h);background:#fff;border:1px solid #d6ccb4;padding:6px 12px;border-radius:8px;cursor:pointer;color:#3a3226;font-size:var(--btn-fs);font-weight:600;-webkit-tap-highlight-color:transparent}
.cn-toolbar button:hover,.cn-dyn-bar button:hover{background:#f5efe0}
.cn-toolbar button.active{background:#3a3226;color:#f5efe0;border-color:#3a3226}
.cn-dyn-bar{padding:8px 10px;background:#f9f5e8;border:1px solid #d6ccb4;border-radius:8px}
.cn-dyn-bar button{border-radius:18px;padding:6px 14px}
#cn-dyn-compare{border-radius:8px;background:#eef4f6}
#cn-dyn-compare[aria-pressed="true"]{background:#5a7a95;color:#fff;border-color:#5a7a95}
.cn-mode-bar{padding:6px 10px;background:#eef4f6;border:1px solid #d6ccb4;border-radius:8px}
.cn-mode-bar button{border-radius:16px;padding:5px 12px}
.cn-mode-bar button.active{background:#5a7a95;color:#fff;border-color:#5a7a95}
.cn-group-label{font-weight:700;color:#5a3210;margin-right:2px}
.cn-stage{position:relative;background:#eef4f6;border:1px solid #d6ccb4;border-radius:8px;overflow:hidden;height:min(70vh,620px);min-height:420px}
.cn-stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.cn-stage svg.dragging{cursor:grabbing}
.cn-panel{box-sizing:border-box;position:absolute;right:12px;top:12px;width:290px;max-height:calc(100% - 24px);overflow-y:auto;background:rgba(255,255,255,.97);border:1px solid #d6ccb4;border-radius:10px;padding:16px;font-size:13.5px;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,.12);opacity:0;transform:translateX(8px);transition:opacity .2s,transform .2s;pointer-events:none;-webkit-overflow-scrolling:touch}
.cn-panel.show{opacity:1;transform:translateX(0);pointer-events:auto}
.cn-panel h3{margin:0 0 4px;font-size:17px;color:#5a3210;font-weight:800;padding-right:32px}
.cn-panel .han{font-size:13px;color:#8a7a55;margin-bottom:10px}
.cn-panel .tag{display:inline-block;font-size:11px;background:#f5efe0;color:#5a4a20;padding:3px 9px;border-radius:4px;margin-right:4px;margin-bottom:8px;font-weight:600}
.cn-panel .tag.era{background:#ecdac0;color:#6a4210}
.cn-panel .desc{color:#3a2f18;white-space:pre-line}
.cn-panel .close{position:absolute;right:8px;top:6px;background:#f5efe0;border:0;width:32px;height:32px;font-size:20px;line-height:1;cursor:pointer;color:#5a3210;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cn-dyn-info{margin-top:8px;padding:12px 14px;background:#fbf7ec;border:1px solid #d6ccb4;border-radius:8px;font-size:13.5px;line-height:1.55;color:#3a2f18;display:none}
.cn-dyn-info.show{display:block}
.cn-dyn-info b{color:#5a3210;font-size:15px}
.cn-dyn-info .yr{color:#8a6a30;font-weight:600;margin-left:6px}
.cn-zoom{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.cn-zoom button{width:42px;height:42px;background:#fff;border:1px solid #d6ccb4;border-radius:8px;cursor:pointer;font-size:20px;font-weight:700;color:#3a3226;box-shadow:0 2px 6px rgba(0,0,0,.1);-webkit-tap-highlight-color:transparent}
.cn-hint{position:absolute;left:10px;bottom:10px;font-size:11px;color:#7a6a55;background:rgba(255,255,255,.9);padding:5px 9px;border-radius:5px;max-width:calc(100% - 20px)}
.cn-item{cursor:pointer}
.cn-item text{user-select:none;-webkit-user-select:none}
.cn-item circle,.cn-item path,.cn-item ellipse,.cn-item rect{transition:filter .15s}
.cn-item:hover>*:not(text){filter:brightness(1.15) drop-shadow(0 0 3px rgba(0,0,0,.3))}
.cn-item:hover text{font-weight:900 !important;stroke-width:4 !important}
.cn-wrap.mode-core .cn-item[data-tier="2"] text,
.cn-wrap.mode-core .cn-item[data-tier="3"] text{display:none}
.cn-wrap.mode-std .cn-item[data-tier="3"] text{display:none}
.cn-toggle{display:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.cn-item:focus{outline:none}
.cn-item:focus-visible>*:not(text){outline:3px solid #2b6cb0;outline-offset:2px}
.cn-item:focus-visible text{stroke:#2b6cb0 !important;stroke-width:4 !important}
.cn-toolbar button:focus-visible,.cn-dyn-bar button:focus-visible,.cn-mode-bar button:focus-visible,.cn-zoom button:focus-visible,.cn-panel .close:focus-visible,.cn-toggle:focus-visible{outline:3px solid #2b6cb0;outline-offset:2px}
.cn-legend{position:absolute;right:10px;bottom:42px;background:rgba(255,255,255,.94);border:1px solid #d6ccb4;border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.5;color:#3a3226;box-shadow:0 2px 8px rgba(0,0,0,.1);max-width:calc(100% - 20px)}
.cn-legend h4{margin:0 0 5px;font-size:11.5px;color:#5a3210;font-weight:700}
.cn-legend .row{display:flex;align-items:center;gap:6px;margin-bottom:2px;white-space:nowrap}
.cn-legend .row:last-child{margin-bottom:0}
.cn-legend .sw{width:14px;height:14px;flex:0 0 auto;display:inline-flex}
.cn-legend.hidden{display:none}
.cn-legend-toggle{position:absolute;right:10px;bottom:10px;font-size:11px;color:#5a3210;background:rgba(255,255,255,.92);border:1px solid #d6ccb4;padding:4px 9px;border-radius:5px;cursor:pointer;font-weight:600;z-index:5}

/* ===== 모바일 대응 ===== */
@media (max-width:768px){
  .cn-wrap{--btn-h:40px;--btn-fs:14px}
  .cn-toggle{display:inline-flex;align-items:center;gap:6px;background:#3a3226;color:#f5efe0;border:0;padding:8px 14px;border-radius:8px;font-size:14px;font-weight:600;min-height:40px;cursor:pointer;-webkit-tap-highlight-color:transparent;margin-bottom:6px;flex:0 0 auto}
  .cn-toggle::after{content:'▼';font-size:10px;transition:transform .2s}
  .cn-toggle.open::after{transform:rotate(180deg)}
  .cn-controls{display:none;flex:0 0 auto}
  .cn-controls.open{display:block}
  .cn-dyn-bar,.cn-toolbar,.cn-mode-bar{gap:6px;padding:8px}
  .cn-dyn-bar button,.cn-toolbar button,.cn-mode-bar button{padding:8px 12px;font-size:13px}
  .cn-stage{height:auto;aspect-ratio:800/560;min-height:0;border-radius:6px}
  /* 하단 시트가 열려도 지도는 위 공간을 채운다(잘림·빈틈 방지) */
  .cn-wrap.sheet-open .cn-dyn-info{display:none}
  /* 패널을 하단 시트로 */
  .cn-panel{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;box-sizing:border-box;
    max-width:100%;max-height:50svh;
    border-radius:16px 16px 0 0;
    transform:translateY(100%);opacity:1;
    padding:18px 18px 24px;
    box-shadow:0 -6px 20px rgba(0,0,0,.18);
    z-index:100;
    border:0;border-top:1px solid #d6ccb4;
  }
  .cn-panel.show{transform:translateY(0)}
  .cn-panel::before{
    content:'';display:block;width:40px;height:4px;background:#d6ccb4;
    border-radius:2px;margin:-6px auto 12px;
  }
  .cn-panel h3{font-size:18px}
  .cn-panel .close{width:36px;height:36px;font-size:22px;top:10px;right:10px}
  .cn-zoom button{width:46px;height:46px;font-size:22px}
  .cn-hint{font-size:10.5px;padding:4px 8px}
  .cn-group-label{font-size:13px;width:100%;margin-bottom:4px}
}

@media (max-width:420px){
  .cn-stage{min-height:0}
  .cn-panel{max-height:52svh;padding:16px 16px 22px}
  .cn-hint{display:none}
  .cn-legend{bottom:44px;right:8px;font-size:10px;padding:6px 8px}
  .cn-legend-toggle{bottom:10px;right:8px}
}

// 렌더 루프가 하나의 필드(geoPaths)만 읽도록 미리 정규화한다.
const REALRIVER={'황하':'황하','장강 (양자강)':'장강','회하':'회하','송화강':'송화강'};
RIVERS.forEach(r=>{
  const style=r.paths[0]||{};
  const realKey=REALRIVER[r.n], real=realKey&&GEO_RIVERS[realKey];
  if(real&&real.length){
    // 실측 경로: 손그림 색/굵기 스타일만 승계
    r.geoPaths=real.map(d=>({d,stroke:style.stroke||'#5a8fb8',width:style.width||4,linecap:'round'}));
  }else{
    r.geoPaths=r.paths.map(p=>({d:p.d,stroke:p.stroke,width:p.width,dash:p.dash,linecap:p.linecap}));
  }
  // 라벨 위치도 단일화: 실측 라벨좌표(RIVER_LL) 우선, 없으면 손그림 라벨
  const rll=RIVER_LL[r.n], l0=r.labels[0]||{};
  if(rll)r.labelSpec=[{x:rll[0],y:rll[1],size:l0.size||11,color:l0.color||'#3a6a95',weight:l0.weight||700,'stroke-width':l0['stroke-width']||3,tier:l0.tier}];
  else r.labelSpec=r.labels;
});
RIVERS.forEach(r=>{
  const g=group(r,r.tier);
  r.geoPaths.forEach(p=>{
    const a={d:p.d,stroke:p.stroke,'stroke-width':p.width,fill:'none'};
    if(p.dash)a['stroke-dasharray']=p.dash;
    if(p.linecap)a['stroke-linecap']=p.linecap;
    g.appendChild(el('path',a));
  });
  r.labelSpec.forEach(l=>{
    const t=txt(l.x,l.y,r.n,l);
    if(l.tier)t.dataset.tier=l.tier;
    if(l.rot){t.setAttribute('transform',`translate(${l.tx},${l.ty}) rotate(${l.rot})`);t.setAttribute('x',0);t.setAttribute('y',0);}
    g.appendChild(t);
  });
  riversG.appendChild(g);
});

  else if(c.t==='lake')g.appendChild(el('ellipse',{cx:c.x,cy:c.y,rx:10*M,ry:5*M,fill:s.fill,stroke:'#fff','stroke-width':1,opacity:0.85}));
  else if(c.t==='fort')g.appendChild(el('path',{d:`M ${c.x},${c.y-SHAPE} L ${c.x+SHAPE},${c.y} L ${c.x},${c.y+SHAPE} L ${c.x-SHAPE},${c.y} Z`,fill:s.fill,stroke:'#fff','stroke-width':1.4,filter:'url(#cn-shadow)'}));
  else g.appendChild(el('circle',{cx:c.x,cy:c.y,r:s.r,fill:s.fill,stroke:'#fff','stroke-width':1.7,filter:'url(#cn-shadow)'}));
  g.appendChild(txt(c.x+(c.tx||8),c.y+(c.ty||4),c.n,{size:s.tsize,weight:s.tw,color:s.tc,anchor:c.ta,'stroke-width':2.8}));
  if(c.t==='mtn'||c.t==='lake')mountains.appendChild(g);
  else if(c.t==='fort')forts.appendChild(g);
  else cities.appendChild(g);
});

const panel=document.getElementById('cn-panel'),pName=document.getElementById('cn-p-name'),pHan=document.getElementById('cn-p-han'),pTags=document.getElementById('cn-p-tags'),pDesc=document.getElementById('cn-p-desc');
const typeLabel={cap:'도읍',city:'주요 도시',silk:'실크로드 관문',fort:'성·관문',mtn:'산·산맥',lake:'호수',river:'강',wall:'구조물',terrain:'지형',sea:'바다','':'지역'};
function openPanel(el){
  const d=el.dataset;
  pName.textContent=d.name||'';pHan.textContent=d.han||'';
  let ttype=d.type;
  if(!ttype){const layer=el.closest('.cn-layer')?.dataset.layer;if(layer==='rivers')ttype='river';else if(layer==='wall')ttype='wall';else if(layer==='terrain')ttype='terrain';else if(layer==='seas')ttype='sea';}
  pTags.innerHTML=`<span class="tag">${typeLabel[ttype]||''}</span>${d.era?`<span class="tag era">${d.era}</span>`:''}`;
  pDesc.textContent=d.desc||'';panel.classList.add('show');
  if(isMobile){panel.scrollTop=0;document.getElementById('cn-wrap').classList.add('sheet-open');}
}
// 정적 SVG 항목(본토·해남도·대만)에도 키보드 접근성 부여
document.querySelectorAll('#cn-viewport>.cn-item').forEach(it=>{
  if(!it.hasAttribute('tabindex'))it.setAttribute('tabindex','0');
  if(!it.hasAttribute('role'))it.setAttribute('role','button');
  if(!it.hasAttribute('aria-label')){const d=it.dataset;it.setAttribute('aria-label',(d.name||'')+(d.han?', '+d.han:''));}
});
let lastFocusedItem=null;
function openPanelFrom(it){lastFocusedItem=it;openPanel(it);const c=document.getElementById('cn-close');if(c)setTimeout(()=>c.focus(),0);}
function closePanel(){panel.classList.remove('show');document.getElementById('cn-wrap').classList.remove('sheet-open');if(lastFocusedItem){try{lastFocusedItem.focus();}catch(_){}lastFocusedItem=null;}}
document.getElementById('cn-viewport').addEventListener('click',e=>{if(justDragged){justDragged=false;return;}const it=e.target.closest('.cn-item');if(it){e.stopPropagation();openPanelFrom(it);}});
document.getElementById('cn-viewport').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const it=e.target.closest('.cn-item');if(it){e.preventDefault();openPanelFrom(it);}});
document.getElementById('cn-close').addEventListener('click',closePanel);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('show'))closePanel();});

// 모바일 하단 시트 스와이프 다운으로 닫기
if(isMobile){
  let sheetY0=0,sheetDy=0,sheetDragging=false;
  panel.addEventListener('touchstart',e=>{if(panel.scrollTop>0)return;sheetY0=e.touches[0].clientY;sheetDragging=true;sheetDy=0;},{passive:true});
  panel.addEventListener('touchmove',e=>{if(!sheetDragging)return;sheetDy=e.touches[0].clientY-sheetY0;if(sheetDy>0){panel.style.transform=`translateY(${sheetDy}px)`;}},{passive:true});
  panel.addEventListener('touchend',()=>{if(!sheetDragging)return;sheetDragging=false;panel.style.transform='';if(sheetDy>80){panel.classList.remove('show');document.getElementById('cn-wrap').classList.remove('sheet-open');}});
}

// 컨트롤 토글 (모바일)
const toggle=document.getElementById('cn-toggle'),controls=document.getElementById('cn-controls');
toggle.addEventListener('click',()=>{
  const open=controls.classList.toggle('open');
  toggle.classList.toggle('open',open);
  toggle.textContent=open?'컨트롤 닫기':'컨트롤 열기';

// 왕조 메타데이터. 강역 path는 상단 GEO_DYN을 단일 출처로 참조(중복 제거)
const DYN_META={
qin:{n:'秦 진',c:'#a89670',y:'BC 221 ~ 206 · 15년',d:'중국 최초의 통일 제국. 진 시황이 6국을 병합. 문자·도량형·화폐·수레 폭 통일. 만리장성 완성. 진도 건설. 분서갱유. 15년 만에 붕괴했으나 이후 2천 년 중국 왕조의 기본틀(황제·군현제·율령)을 남김.'},
han:{n:'漢 한',c:'#b85450',y:'BC 202 ~ AD 220',d:'400여 년의 대제국. 유방이 항우를 격파하고 건국. 무제 대 흉노 정벌, 장건의 서역 사행(BC 138)으로 실크로드 개통, 하서사군 설치. 유교 국교화. 왕망의 신 이후 광무제가 후한 재건.'},
tang:{n:'唐 당',c:'#d4a017',y:'618 ~ 907 · 290년',d:'세계 제국의 절정. 이연·이세민 태원 거병. 태종·현종 대 최대 판도. 장안 100만+의 국제도시. 이백·두보. 안사의 난(755) 이후 절도사 할거로 쇠락, 황소의 난·주전충으로 멸망.'},
nsong:{n:'北宋 북송',c:'#4a8ea8',y:'960 ~ 1127 · 167년',d:'문치주의. 조광윤 개봉 도읍. 성리학 태동. 나침반·화약·활자 인쇄술. 개봉 100만. 요에 연운16주, 서하에 하서 상실. 1127년 정강의 변으로 금나라에 함락.'},
ssong:{n:'南宋 남송',c:'#7a5aa8',y:'1127 ~ 1279 · 152년',d:'회하 이남으로 축소. 임안 도읍. 진령-회하선이 금과의 국경. 성리학 완성(주희). 몽골에 40년 저항(양양·조어). 1279년 애산 해전에서 육수부·문천상 순사.'},
yuan:{n:'元 원',c:'#3a5a80',y:'1271 ~ 1368 · 97년',d:'최초의 이민족 통일 왕조. 쿠빌라이 대도(북경) 천도. 팍스 몽골리카. 마르코 폴로 왕래. 4계급제. 파스파 문자. 홍건적·주원장 봉기로 1368년 붕괴.'},
ming:{n:'明 명',c:'#d97e3a',y:'1368 ~ 1644 · 276년',d:'한족 부흥 왕조. 주원장 남경 건국. 영락제 북경 천도(1421) 자금성. 정화 7차 원정(1405~1433). 만리장성 최종 완성. 이자성 난과 오삼계 청군 유도로 1644년 붕괴.'},
qing:{n:'淸 청',c:'#4a7a4a',y:'1644 ~ 1912 · 268년',d:'만주족 왕조. 강희·옹정·건륭 3대 성세 — 강역 사상 최대. 대만(1683)·티베트(1720)·신강(1759). 아편전쟁(1840)으로 반식민지화. 태평천국·의화단·신해혁명으로 붕괴, 부의 퇴위(1912).'}
};
const DYN={};
for(const k in DYN_META){DYN[k]={...DYN_META[k],p:GEO_DYN[k]};}
const dynLayer=document.getElementById('cn-dynasty'),dynInfo=document.getElementById('cn-dyn-info');
const compareBtn=document.getElementById('cn-dyn-compare');
let compareMode=false;
const selected=[];  // 선택된 왕조 키 배열(순서 유지). 단일 모드에서는 최대 1개.

function dynBtn(k){return document.querySelector(`.cn-dyn-bar button[data-dyn="${k}"]`);}

function renderOverlays(){
  // 강역 path 다시 그리기
  dynLayer.innerHTML='';
  selected.forEach(k=>{
    const D=DYN[k];
    dynLayer.appendChild(el('path',{d:D.p,fill:D.c,stroke:D.c,'stroke-width':2,opacity:compareMode?0.32:0.42}));
  });
  // 버튼 스타일
  document.querySelectorAll('.cn-dyn-bar button[data-dyn]').forEach(x=>{
    const key=x.dataset.dyn;
    if(key==='none'){const active=selected.length===0;x.style.background=active?'#3a3226':'';x.style.color=active?'#f5efe0':'';x.style.borderColor='';x.setAttribute('aria-pressed',active);return;}
    const on=selected.includes(key);
    x.style.background=on?DYN[key].c:'';x.style.color=on?'#fff':'';x.style.borderColor=on?DYN[key].c:'';x.setAttribute('aria-pressed',on);
  });
  // 정보 패널
  if(selected.length===0){dynInfo.classList.remove('show');dynInfo.innerHTML='';}
  else{
    dynInfo.innerHTML=selected.map(k=>{const D=DYN[k];
      return `<div style="margin-bottom:8px"><span style="display:inline-block;width:11px;height:11px;border-radius:2px;background:${D.c};margin-right:6px;vertical-align:middle"></span><b>${D.n}</b><span class="yr">${D.y}</span><div style="margin-top:4px">${D.d}</div></div>`;
    }).join('');
    dynInfo.classList.add('show');
  }
}

document.querySelectorAll('.cn-dyn-bar button[data-dyn]').forEach(b=>{
  b.setAttribute('aria-pressed','false');
  b.addEventListener('click',()=>{
    const k=b.dataset.dyn;
    if(k==='none'){selected.length=0;}
    else if(compareMode){
      const i=selected.indexOf(k);
      if(i>=0)selected.splice(i,1); else selected.push(k);  // 토글
    } else {
      // 단일 모드: 같은 것 누르면 해제, 아니면 교체
      if(selected.length===1&&selected[0]===k)selected.length=0;
      else{selected.length=0;selected.push(k);}
    }
    renderOverlays();
  });
});

compareBtn.addEventListener('click',()=>{
  compareMode=!compareMode;
  compareBtn.setAttribute('aria-pressed',compareMode);
  compareBtn.textContent=compareMode?'비교 종료':'겹쳐 비교';
  // 비교 모드를 끄면 선택을 가장 최근 1개만 남김
  if(!compareMode&&selected.length>1)selected.splice(0,selected.length-1);
  renderOverlays();
});
renderOverlays();
document.querySelectorAll('.cn-toolbar button[data-layer]').forEach(b=>{
  b.addEventListener('click',()=>{const on=b.classList.toggle('active');b.setAttribute('aria-pressed',on);const key=b.dataset.layer;document.querySelectorAll(`.cn-layer[data-layer="${key}"]`).forEach(g=>{g.style.display=on?'':'none';});});
});
// 범례 접기/펴기
const legend=document.getElementById('cn-legend'),legendToggle=document.getElementById('cn-legend-toggle');
// 좁은 화면에서는 범례가 지도를 가리지 않도록 접힌 상태로 시작
if(legend&&legendToggle&&matchMedia('(max-width:900px)').matches){legend.classList.add('hidden');legendToggle.setAttribute('aria-expanded','false');legendToggle.textContent='범례 열기';}
if(legendToggle){legendToggle.addEventListener('click',()=>{const hidden=legend.classList.toggle('hidden');legendToggle.setAttribute('aria-expanded',!hidden);legendToggle.textContent=hidden?'범례 열기':'범례 닫기';});}
const wrap=document.getElementById('cn-wrap');
document.querySelectorAll('.cn-mode-bar button').forEach(b=>{
  b.addEventListener('click',()=>{document.querySelectorAll('.cn-mode-bar button').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false');});b.classList.add('active');b.setAttribute('aria-pressed','true');wrap.classList.remove('mode-core','mode-std','mode-detail');wrap.classList.add('mode-'+b.dataset.mode);});
});

// 모바일 초기 라벨 밀도: 핵심으로 시작해 화면 깔끔하게
if(isMobile){
  document.querySelectorAll('.cn-mode-bar button').forEach(x=>x.classList.remove('active'));
  const coreBtn=document.querySelector('.cn-mode-bar button[data-mode="core"]');
  if(coreBtn){coreBtn.classList.add('active');wrap.classList.remove('mode-detail');wrap.classList.add('mode-core');}
}

const svg=document.getElementById('cn-svg');
const MAP={w:800,h:560};  // 지도 콘텐츠 기준 크기
let vx=0,vy=0,vw=800,vh=560;
let fitW=800,fitH=560;  // 현재 컨테이너에 맞춘 최대(줌아웃 한계) 뷰 크기
function setView(){svg.setAttribute('viewBox',`${vx} ${vy} ${vw} ${vh}`);}
// 컨테이너 비율에 맞춰 지도가 여백 없이 꽉 차도록 초기 뷰 계산(지도 전체는 항상 보이게 확장)
function fitView(){
  const r=document.getElementById('cn-stage').getBoundingClientRect();
  if(!r.width||!r.height){vx=0;vy=0;vw=fitW=MAP.w;vh=fitH=MAP.h;setView();return;}
  const cAsp=r.width/r.height, mAsp=MAP.w/MAP.h;
  if(cAsp<mAsp){fitW=MAP.w; fitH=MAP.w/cAsp;}
  else{fitH=MAP.h; fitW=MAP.h*cAsp;}
  vw=fitW; vh=fitH;
  vx=(MAP.w-vw)/2; vy=(MAP.h-vh)/2;
  setView();
}
function zoomAt(cx,cy,k){vw*=k;vh*=k;vx=cx-vw/2;vy=cy-vh/2;setView();}
document.getElementById('cn-in').addEventListener('click',()=>zoomAt(vx+vw/2,vy+vh/2,0.7));
document.getElementById('cn-out').addEventListener('click',()=>{const nvw=Math.min(fitW,vw/0.7),nvh=Math.min(fitH,vh/0.7);const cx=vx+vw/2,cy=vy+vh/2;vw=nvw;vh=nvh;vx=cx-vw/2;vy=cy-vh/2;setView();});
document.getElementById('cn-reset').addEventListener('click',fitView);
fitView();
window.addEventListener('resize',fitView);
requestAnimationFrame(fitView);
setTimeout(fitView,300);

// 팬 + 핀치줌
let mightDrag=false,dragging=false,justDragged=false,sx=0,sy=0,startVx=0,startVy=0;
const pointers=new Map();let pinchDist=0,pinchCx=0,pinchCy=0;
function getSvgCoord(cx,cy){const r=svg.getBoundingClientRect();return{x:vx+(cx-r.left)/r.width*vw,y:vy+(cy-r.top)/r.height*vh};}
svg.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){mightDrag=true;dragging=false;justDragged=false;sx=e.clientX;sy=e.clientY;startVx=vx;startVy=vy;}
  else if(pointers.size===2){mightDrag=false;const pts=[...pointers.values()];pinchDist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};const svgP=getSvgCoord(mid.x,mid.y);pinchCx=svgP.x;pinchCy=svgP.y;}
  try{svg.setPointerCapture(e.pointerId);}catch(_){}
});
svg.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const pts=[...pointers.values()];const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    if(pinchDist>0){const k=pinchDist/d;vw=Math.max(50,Math.min(fitW,vw*k));vh=Math.max(35,Math.min(fitH,vh*k));const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};const r=svg.getBoundingClientRect();vx=pinchCx-(mid.x-r.left)/r.width*vw;vy=pinchCy-(mid.y-r.top)/r.height*vh;setView();}
    pinchDist=d;justDragged=true;return;
  }
  if(!mightDrag)return;
  const dx=Math.abs(e.clientX-sx),dy=Math.abs(e.clientY-sy);
  if(!dragging&&dx+dy>6){dragging=true;svg.classList.add('dragging');}
  if(dragging){const r=svg.getBoundingClientRect();const scale=vw/r.width;vx=startVx-(e.clientX-sx)*scale;vy=startVy-(e.clientY-sy)*scale;setView();}
});
function endPtr(e){
  pointers.delete(e.pointerId);
  if(dragging)justDragged=true;
  if(pointers.size<2)pinchDist=0;
  if(pointers.size===0){mightDrag=false;dragging=false;svg.classList.remove('dragging');}
  try{svg.releasePointerCapture(e.pointerId);}catch(_){}
}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();const p=getSvgCoord(e.clientX,e.clientY);const k=e.deltaY<0?0.85:1/0.85;vw*=k;vh*=k;const r=svg.getBoundingClientRect();vx=p.x-(e.clientX-r.left)/r.width*vw;vy=p.y-(e.clientY-r.top)/r.height*vh;setView();},{passive:false});

// 더블탭 확대 (모바일)
let lastTap=0;
svg.addEventListener('click',e=>{
  const now=Date.now();
  if(now-lastTap<300&&!justDragged){
    const p=getSvgCoord(e.clientX,e.clientY);
    zoomAt(p.x,p.y,0.6);
  }
  lastTap=now;
});


})();
</script>
