/* ===== 모바일 대응 ===== */
@media (max-width:768px){
  .cn-wrap{--btn-h:40px;--btn-fs:14px}
  .cn-toggle{display:inline-flex;align-items:center;gap:6px;background:#3a3226;color:#f5efe0;border:0;padding:8px 14px;border-radius:8px;font-size:14px;font-weight:600;min-height:40px;cursor:pointer;-webkit-tap-highlight-color:transparent;margin-bottom:6px;flex:0 0 auto}
  .cn-toggle::after{content:'▼';font-size:10px;transition:transform .2s}
  .cn-toggle.open::after{transform:rotate(180deg)}
  .cn-controls{display:none;flex:0 0 auto}
  .cn-controls.open{display:block}
  .cn-dyn-bar,.cn-toolbar,.cn-mode-bar{gap:6px;padding:8px}
  .cn-dyn-bar button,.cn-toolbar button,.cn-mode-bar button{padding:8px 12px;font-size:13px}
  .cn-stage{height:auto;aspect-ratio:800/560;min-height:0;border-radius:6px}
  /* 하단 시트가 열려도 지도는 위 공간을 채운다(잘림·빈틈 방지) */
  .cn-wrap.sheet-open .cn-dyn-info{display:none}
  /* 패널을 하단 시트로 */
  .cn-panel{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;box-sizing:border-box;
    max-width:100%;max-height:50svh;
    border-radius:16px 16px 0 0;
    transform:translateY(100%);opacity:1;
    padding:18px 18px 24px;
    box-shadow:0 -6px 20px rgba(0,0,0,.18);
    z-index:100;
    border:0;border-top:1px solid #d6ccb4;
  }
  .cn-panel.show{transform:translateY(0)}
  .cn-panel::before{
    content:'';display:block;width:40px;height:4px;background:#d6ccb4;
    border-radius:2px;margin:-6px auto 12px;
  }
  .cn-panel h3{font-size:18px}
  .cn-panel .close{width:36px;height:36px;font-size:22px;top:10px;right:10px}
  .cn-zoom button{width:46px;height:46px;font-size:22px}
  .cn-hint{font-size:10.5px;padding:4px 8px}
  .cn-group-label{font-size:13px;width:100%;margin-bottom:4px}
}

@media (max-width:420px){

}

<g class="cn-item" data-name="중국 본토 (중원)" data-han="中國 · 中原" data-era="지리" data-desc="서쪽 파미르·히말라야에서 동쪽 태평양 연안까지, 북쪽 흑룡강에서 남쪽 남해까지 펼쳐진 대륙 본토. 서쪽이 높고 동쪽이 낮은 3단 계단 지형으로, 청장고원(1단), 몽골·황토·운귀고원과 사천·타림 분지(2단), 동부의 평원과 구릉(3단)이 차례로 내려앉는다. 그래서 황하와 장강 같은 큰 강은 대부분 서에서 동으로 흐른다.&#10;‘중원’은 좁게는 황하 중·하류의 화북평원, 특히 낙양과 개봉 일대를 가리킨다. 하·상·주 이래 이곳이 화하 문명의 중심이자 정통 왕조의 무대였기에 ‘중원을 얻는 자가 천하를 얻는다’는 말이 생겼다. 넓게는 변경 이민족 지역과 구별되는 중국 본토 전체를 뜻한다. 정치 중심은 장안→낙양→개봉→북경으로 동쪽과 북쪽으로 옮겨 갔고, 경제 중심은 육조·남송을 거치며 화북에서 강남으로 이동했다.">

<g class="cn-item" data-name="해남도" data-han="海南島 · 하이난" data-era="한~현대" data-desc="광동 뇌주반도 남쪽, 경주해협 건너에 있는 약 3만 4천 km²의 섬. 대만 다음으로 큰 중국의 섬이며, 열대 계절풍 기후로 야자·고무·후추가 자란다.&#10;BC 110년 한 무제가 남월을 멸한 뒤 주애·담이 두 군을 설치하며 처음 중국 왕조에 편입되었으나, 현지 여족(黎族)의 반발이 잇따라 한 원제 때 주애군을 폐지했다. 이후 오랫동안 ‘하늘 끝 바다 끝(天涯海角)’으로 여겨져 유배지가 되었다. 당의 재상 이덕유, 북송의 소식이 이곳으로 유배되었는데, 소식은 1097~1100년 담주에 머물며 학당을 열어 해남 최초의 진사가 나오는 기틀을 닦았다. 명대에는 대학자 구준과 청백리 해서가 이 섬에서 나왔다. 1988년 해남성이 독립된 성이 되며 최대의 경제특구가 되었고, 2020년부터 자유무역항을 건설하고 있다.">

<g class="cn-item" data-name="대만" data-han="臺灣 · Taiwan" data-era="명 말~현대" data-desc="복건 동쪽, 대만해협 건너의 약 3만 6천 km² 섬. 산지가 섬의 3분의 2를 차지하며, 본래 오스트로네시아계 원주민이 살았다.&#10;17세기 초 네덜란드 동인도회사가 남부에 질란디아 요새를 쌓았고, 스페인이 한때 북부를 차지했다. 1662년 반청 복명 운동을 이끈 정성공이 네덜란드를 몰아내고 정씨 정권(동녕왕국)을 세웠다. 1683년 청의 시랑이 정씨를 항복시켜 이듬해 복건성에 속한 대만부가 설치되었고, 복건·광동에서 이주민이 크게 늘었다. 1885년 대만성으로 승격했으나, 청일전쟁 패배로 1895년 시모노세키조약에 따라 일본에 할양되어 50년간 식민 통치를 받았다. 1945년 중화민국에 반환되었고, 1949년 국공내전에서 패한 국민당 정부가 옮겨 와 오늘날까지 양안 관계의 핵심 쟁점이 되고 있다.">

{n:'황해',h:'黃海',e:'한반도-중국 해로',d:"한반도 서해안과 중국 산동·강소·요동 사이의 반폐쇄해. 평균 수심 약 44m로 얕고, 황하·회하가 실어 온 황토 때문에 물빛이 누렇게 보여 이름이 붙었다. 조수 간만의 차가 커서 서해안에 넓은 갯벌이 발달했다.\n고대부터 한반도와 중국을 잇는 가장 가까운 바닷길이었다. 백제는 산동·강남과 활발히 교역했고, 신라는 당항성에서 산동 등주로 사신을 보냈으며, 9세기 장보고의 청해진 선단이 이 바다의 무역을 장악했다. 660년 소정방의 당군도 산동에서 황해를 건너 백제를 공격했다. 송대 고려 사신은 흑산도를 거쳐 명주(영파)로 가는 남쪽 항로를 이용했다. 1894년 청일전쟁 때 압록강 하구 앞바다에서 벌어진 황해해전으로 청의 북양함대가 큰 타격을 입었다.",rx:648,ry:290,rw:105,rh:100,lx:695,ly:340,ls:12,tier:2},
{n:'발해',h:'渤海',e:'화북-요동 만',d:"요동반도와 산동반도가 감싸 안은, 내해에 가까운 만. 평균 수심 약 18m로 매우 얕고 황하·해하·요하가 흘러든다. 입구의 묘도열도가 요동과 산동을 징검다리처럼 잇는다.\n진 시황과 한 무제는 방사를 이 바다로 보내 봉래·방장·영주 삼신산의 불사약을 구하게 했고, 서복 전설도 여기서 시작된다. 수·당의 고구려 원정 때는 수군이 산동 동래에서 이 바다를 건너 요동과 평양을 노렸다. 원·명·청대에는 강남의 곡물을 북경으로 올리는 해운 항로의 종착지였고, 청말에는 입구의 여순과 위해가 북양함대의 근거지가 되었다. 698년 세워진 발해국의 국호도 당이 대조영을 ‘발해군왕’에 봉한 데서 비롯했다.",rx:585,ry:252,rw:52,rh:32,lx:610,ly:272,ls:10,tier:2},
{n:'동중국해',h:'東海',e:'중국-일본-류큐',d:"중국 강소·절강·복건 해안과 한반도 남부, 일본 규슈, 류큐 열도, 대만으로 둘러싸인 바다. 대륙붕이 넓어 수심이 얕은 편이고, 장강이 막대한 담수와 토사를 쏟아낸다. 대만 동쪽에서 쿠로시오 해류가 북상한다.\n당대에는 일본 견당사 선박이 규슈에서 이 바다를 곧바로 건너 명주·양주로 향하는 남로를 이용했으나 난파가 잦았다. 양주의 승려 감진은 다섯 번 실패하고 실명까지 한 끝에 753년 여섯 번째 시도로 일본에 건너가 율종을 전했다. 송·원대에는 명주(영파)가 고려·일본 무역의 창구였고, 명대에는 왜구가 이 바다를 따라 강남 해안을 약탈해 해금 정책이 강화되었다. 오늘날에는 댜오위다오(센카쿠) 영유권과 대륙붕 경계를 둘러싼 갈등이 이어지는 해역이다.",rx:660,ry:390,rw:130,rh:70,lx:700,ly:420,ls:11,tier:2},

{n:'강남',h:'江南',e:'남송 이후 경제 중심',d:"장강 하류 남쪽, 태호를 중심으로 한 삼각주 일대. 강소 남부·절강 북부·상해에 해당하며, 운하와 수로가 거미줄처럼 얽힌 물의 고장이다.\n육조 시대 북방 인구가 대거 남하하며 개발이 본격화했고, 수 양제의 대운하로 화북과 연결되면서 제국의 곡창이 되었다. 안사의 난 이후 당의 재정이 강남에 의존하게 되었고, 남송이 항주에 도읍하면서 경제·문화의 중심이 완전히 남쪽으로 옮겨 왔다. ‘소주와 호주가 풍년이면 천하가 배부르다(蘇湖熟 天下足)’는 속담이 이때 생겼다. 명·청대에는 비단·면직물·차 생산과 상업이 번성하고 과거 급제자와 장서가가 몰려, ‘하늘에는 천당, 땅에는 소주·항주’라는 말을 낳았다.",p:'M 500,362 Q 490,408 528,428 Q 582,438 618,418 Q 620,395 610,362 Q 572,346 532,352 Q 505,355 500,362 Z',fill:'#dcead0',stroke:'#8fa668',lx:560,ly:393,lc:'#5a7a2a',ls:11},

{n:'사천분지',h:'四川盆地',e:"'천부지국'",d:"진령·대파산·무산·운귀고원에 사방이 둘러싸인 약 26만 km²의 분지. 따뜻하고 습하며 붉은 자색토가 기름져 농사가 잘 되고, 안개가 잦아 ‘촉나라 개는 해를 보면 짖는다(蜀犬吠日)’는 말이 생겼다.\n고대에는 파와 촉이 독자 문명을 이루었으며, 삼성퇴 유적의 청동 가면은 중원과 전혀 다른 문화를 보여 준다. BC 316년 진이 촉을 병합했고, 이빙 부자가 민강에 도강언을 쌓아 성도평원을 홍수 없는 옥토로 바꾸었다. 이 풍부한 식량이 진의 천하 통일을 뒷받침했고, 이후 ‘하늘이 내린 곳간’ 천부지국으로 불렸다. 험한 산이 둘러싸 방어에 유리해 촉한·성한·전촉·후촉 등 할거 정권이 자주 들어섰고, 중일전쟁 때는 국민정부가 중경으로 옮겨 최후의 근거지로 삼았다.",p:'M 265,340 Q 253,380 280,405 Q 320,415 350,395 Q 365,360 340,340 Q 300,330 275,335 Q 268,338 265,340 Z',fill:'#e0dcc0',stroke:'#a89670',lx:305,ly:378,lc:'#7a6a45',ls:10},
{n:'운귀고원',h:'雲貴高原',e:'다민족 지대',d:"운남 동부와 귀주에 걸친 해발 1,000~2,000m의 고원. 석회암이 녹아 만든 카르스트 지형이 발달해 봉우리 숲과 동굴, 지하 하천이 많다. ‘하늘은 사흘 맑은 날이 없고 땅은 세 자 평평한 곳이 없다’던 귀주가 이곳이다.\n중원 왕조의 통제가 약해 오랫동안 여러 민족이 자립했다. 한 무제 때 전국(滇國)이 복속해 ‘전왕지인’을 받았고, 삼국시대 제갈량이 남중을 정벌했다. 8세기에는 남조가, 10세기에는 대리국이 이곳을 중심으로 독립 왕국을 세웠다. 1253년 쿠빌라이가 대리를 정복하며 원에 편입되었고, 명·청대에는 토사 제도로 현지 수장을 통해 다스리다 점차 중앙 관리로 교체했다(개토귀류). 지금도 이·묘·백·하니·태족 등 많은 소수민족이 산다.",p:'M 260,385 Q 250,420 285,442 Q 320,450 345,432 Q 360,405 335,388 Q 300,378 275,382 Q 262,383 260,385 Z',fill:'#e8dcc0',stroke:'#b8a075',lx:300,ly:422,lc:'#7a6a45',ls:10},
{n:'동북평원',h:'東北平原',e:'35만 km² · 만주',d:"송화강·눈강·요하가 만든 중국 최대의 평원(약 35만 km²). 대·소흥안령과 장백산맥에 둘러싸여 있으며, 부식질이 풍부한 검은 흑토가 넓게 덮여 오늘날 콩·옥수수·쌀의 대곡창이다.\n고대에는 부여와 고구려가 이 땅에서 일어났고, 이후 발해가 ‘해동성국’을 이루었다. 10세기 거란(요), 12세기 여진(금), 17세기 만주(청)가 모두 이 일대에서 일어나 중원을 차지했다. 청은 발상지를 보호한다며 한족의 이주를 막는 봉금 정책을 폈으나, 19세기 말부터 산동·하북 농민이 대거 이주(틈관동)해 개간이 본격화했다. 20세기에는 러시아와 일본이 철도를 놓고 각축했고, 1932년 일본이 만주국을 세웠다.",p:'M 570,140 Q 555,175 585,200 Q 625,210 645,185 Q 660,155 635,135 Q 600,125 578,130 Q 572,133 570,140 Z',fill:'#e0e8d0',stroke:'#8fa668',lx:600,ly:170,lc:'#5a7a2a',ls:10}

{n:'대운하',h:'京杭大運河',e:'수 양제 · 605~610',d:"북경에서 항주까지 약 1,794km를 잇는 세계 최장의 인공 수로. 해하·황하·회하·장강·전당강 다섯 수계를 남북으로 연결한다.\n춘추시대 오왕 부차가 판 한구 같은 구간별 운하가 있었지만, 수 양제가 605~610년 낙양을 중심으로 통제거·영제거·강남하 등을 이어 대운하 체계를 완성했다. 강남의 곡물을 수도로 나르는 조운이 제국 재정의 생명선이 되었고, 양주·회안·개봉 같은 운하 도시가 번영했다. 원은 수도를 대도로 옮기며 산동을 직통하는 회통하·통혜하를 새로 뚫어 오늘날의 경항운하 노선을 만들었다. 명·청대에도 조운을 위해 끊임없이 준설했으나, 19세기 황하의 물길 변경과 해운·철도의 발달로 쇠퇴했다. 2014년 세계문화유산에 등재되었다.",paths:[{d:'M 555,210 Q 545,260 540,290 Q 540,320 542,340 Q 555,370 590,388',stroke:'#7fb3d4',width:4,dash:'3 2'}],labels:[{x:0,y:0,rot:78,tx:550,ty:300,size:10,color:'#4a8ea8',weight:700,'stroke-width':2.5}],tier:2},
{n:'황하',h:'黃河',e:'5,464km · 4대 강',d:"청장고원 동북부에서 발원해 발해로 흘러드는 약 5,464km의 강. 중국에서 두 번째로 길며, 도중에 ‘几’자 모양으로 크게 휘돌아 오르도스를 감싼다. 황토고원을 지나며 막대한 흙을 싣고 와 세계에서 손꼽히게 탁한 강이 되었다.\n중류 유역에서 앙소·용산 문화가 일어났고, 하·상·주 이래 역대 왕조의 중심지가 이 강 유역에 있어 ‘화하 문명의 어머니’로 불린다. 그러나 하류에 흙이 쌓여 강바닥이 주변 평야보다 높아지면서 2천여 년간 1,500차례 넘는 제방 붕괴와 20여 차례의 큰 물길 변경이 일어나 ‘중국의 슬픔’이라는 별명도 얻었다. 1128년 남송이 금군을 막으려 둑을 터뜨린 뒤 황하는 회하 쪽으로 흘렀다가, 1855년 다시 북쪽 산동으로 물길을 바꿨다. 치수는 역대 왕조의 가장 중요한 과제였다.",paths:[{d:'M 190,268 Q 240,248 290,253 Q 330,238 350,202 Q 385,188 420,202 Q 452,222 462,252 Q 472,238 492,242 Q 522,253 558,242 Q 582,238 600,238',stroke:'#d4a95a',width:5,linecap:'round'}],labels:[{x:250,y:243,size:13,color:'#a68030',weight:800,'stroke-width':3,tier:1},{x:500,y:235,size:11,color:'#a68030',weight:700,'stroke-width':3,tier:2}],tier:1},
{n:'위수',h:'渭水',e:'황하 최대 지류',d:"감숙 위원현에서 발원해 섬서 중부를 동쪽으로 가로질러 동관 부근에서 황하에 합류하는 황하 최대의 지류(약 818km). 이 강이 만든 분지가 사방이 산과 관문으로 둘러싸인 ‘관중(關中) 평원’이다.\n관중은 방어에 유리하고 땅이 비옥해, 주의 풍경·호경, 진의 함양, 서한·수·당의 장안이 모두 위수 가에 자리하며 천 년 넘게 중국의 정치 중심이었다. 강태공이 곧은 낚싯바늘을 드리우고 주 문왕을 기다린 곳도 위수의 지류 반계라고 전한다. 지류 경수와 만나는 곳은 맑은 물과 흐린 물이 섞이지 않아 옳고 그름이 뚜렷함을 뜻하는 ‘경위분명(涇渭分明)’이라는 성어를 낳았다. 당 이후 정치 중심이 동쪽으로 옮겨 가며 관중의 위상도 기울었다.",paths:[{d:'M 300,290 Q 340,278 380,268 Q 405,262 420,258',stroke:'#d4a95a',width:3}],labels:[{x:340,y:298,size:10,color:'#a68030',weight:600,'stroke-width':2.5,tier:3}],tier:3},
{n:'회하',h:'淮河',e:'남북 경계 · 1,000km',d:"하남 동백산에서 발원해 안휘·강소를 거쳐 홍택호로 흘러드는 약 1,000km의 강. 진령산맥과 이어지는 ‘진령-회하선’은 연 강수량 800mm 선, 1월 평균기온 0℃ 선과 거의 겹쳐 중국 남북을 가르는 경계가 된다. 북쪽은 밀과 조, 남쪽은 벼농사가 중심이다.\n『안자춘추』의 ‘귤이 회남에서 나면 귤이지만 회북에서 나면 탱자가 된다’는 말도 이 강을 두고 한 것이다. 남북이 대치할 때마다 전선이 되어, 383년 비수 전투에서 동진이 전진의 대군을 물리쳤고, 1141년 소흥화의로 남송과 금의 국경이 회하로 정해졌다. 12세기 이후 황하가 남쪽으로 흘러 회하 하류를 빼앗으면서 물길이 막혀, 회하 유역은 오랫동안 상습 홍수 지대가 되었다. 1950년대 대규모 치수 사업이 벌어졌다.",paths:[{d:'M 445,318 Q 490,323 540,328 Q 575,323 610,320',stroke:'#7ba8c9',width:3.5}],labels:[{x:500,y:313,size:11,color:'#3a6a95',weight:700,'stroke-width':3,tier:2}],tier:2},
{n:'장강 (양자강)',h:'長江 · 揚子江',e:'6,300km · 4대 강',d:"청장고원 탕구라산맥에서 발원해 상해에서 동중국해로 흘러드는 약 6,300km의 강. 아시아에서 가장 길고 세계에서 세 번째로 긴 강이며, 유역 면적이 중국 국토의 약 5분의 1에 이른다. ‘양자강’은 본래 양주 부근 하류 구간의 이름이었는데 서양인들이 강 전체를 부르는 말로 썼다.\n중·하류의 넓은 평야와 호수는 벼농사의 중심지였고, 절강 하모도 유적에서는 7천 년 전 볍씨가 나왔다. 강폭이 넓어 남북 사이의 천연 방어선이 되어, 208년 적벽대전에서 손권·유비 연합군이 조조를 막았고, 동진·남조와 남송도 이 강에 기대어 북방 세력과 맞섰다. 근대에는 태평천국이 남경을 수도로 삼았고, 1911년 무창 봉기가 신해혁명의 불씨가 되었다. 중류 삼협에는 세계 최대의 삼협댐이 2006년 댐체를 완공했다.",paths:[{d:'M 155,332 Q 210,342 265,352 Q 315,348 360,368 Q 410,392 465,392 Q 515,402 555,392 Q 595,392 620,378',stroke:'#5a8fb8',width:5,linecap:'round'}],labels:[{x:270,y:336,size:13,color:'#3a6a95',weight:800,'stroke-width':3,tier:1}],tier:1},
{n:'한수 (한강)',h:'漢水',e:'장강 최장 지류',d:"섬서 남부 진령 남쪽에서 발원해 한중분지를 지나 호북 무한에서 장강에 합류하는 장강 최장의 지류(약 1,577km).\nBC 206년 항우는 유방을 궁벽한 한중 땅의 한왕으로 봉했는데, 유방이 이곳을 발판으로 천하를 차지하면서 나라 이름이 ‘한(漢)’이 되었다. 이 국호는 이후 한족·한자·한문처럼 중국 자체를 가리키는 말로 자리 잡았다. 중류의 양양·번성은 남북을 잇는 요충이어서, 삼국시대 관우가 번성을 포위하다 형주를 잃었고, 남송은 이곳에서 몽골군을 6년 가까이 막아 냈다. 하류의 한구는 ‘한수의 어귀’라는 뜻으로 무창·한양과 함께 오늘날의 무한을 이룬다. 지금은 상류 단강구 댐이 남수북조 중선의 수원지로 북경까지 물을 보낸다.",paths:[{d:'M 410,300 Q 430,340 450,370 Q 460,380 465,388',stroke:'#7ba8c9',width:3}],labels:[{x:418,y:352,size:10,color:'#3a6a95',weight:600,'stroke-width':2.5,tier:3}],tier:3},
{n:'상강',h:'湘江',e:'장강 지류 · 호남',d:"광서 흥안현에서 발원해 호남을 남북으로 관통하며 동정호로 흘러드는 약 856km의 강. 호남성의 약칭 ‘상(湘)’이 이 강에서 왔다.\n진 시황은 남월 정벌을 위해 상강과 이강을 잇는 영거 운하를 뚫어 장강 수계와 주강 수계를 연결했다. 전국시대 초의 땅으로, 추방된 굴원이 이 일대를 떠돌며 「이소」 등을 짓고 멱라강에 몸을 던졌다고 전한다. 순임금의 두 왕비 아황·여영이 남편을 찾아 이곳에 이르러 흘린 눈물이 대나무에 얼룩졌다는 ‘상비죽’ 전설도 있다. 유역의 장사에서는 서한 마왕퇴 무덤이 발굴되어 백서와 비단 그림이 쏟아졌다. 근대에는 증국번의 상군이 이 강을 따라 태평천국과 싸웠고, 마오쩌둥이 청년기를 보냈다.",paths:[{d:'M 445,455 Q 448,430 452,410 Q 458,395 463,388',stroke:'#7ba8c9',width:3}],labels:[{x:430,y:440,size:10,color:'#3a6a95',weight:600,'stroke-width':2.5,tier:3}],tier:3},
{n:'주강',h:'珠江',e:'2,214km · 4대 강',d:"서강·북강·동강이 광주 부근에서 모여 남중국해로 흘러드는 강. 가장 긴 서강 기준 약 2,214km로 유량은 장강 다음이며, 하구에 광주·심천·홍콩·마카오를 품은 주강 삼각주를 이룬다.\n진 시황의 영남 정벌 뒤 진의 장수 조타가 BC 203년 번우(광주)에 남월국을 세웠고, 한 무제가 BC 111년 이를 멸했다. 광주는 이후 2천 년 넘게 거의 끊임없이 열려 있던 무역항으로, 당대에는 아랍 상인의 거류지가 있었다. 청은 1757년 서양 무역을 광주 한 곳으로 제한하고 13행 상인에게 독점시켰는데, 아편 밀무역과 임칙서의 아편 몰수가 아편전쟁(1840)으로 이어졌다. 1842년 홍콩이 영국에 할양되었고, 1980년 심천이 첫 경제특구가 되며 개혁개방의 중심이 되었다.",paths:[{d:'M 385,455 Q 435,455 490,460 Q 540,462 570,450',stroke:'#5a8fb8',width:4}],labels:[{x:463,y:475,size:11,color:'#3a6a95',weight:700,'stroke-width':3,tier:2}],tier:2},
{n:'송화강',h:'松花江',e:'흑룡강 지류',d:"백두산(장백산) 천지 부근에서 발원해 길림·흑룡강성을 지나 흑룡강(아무르강)에 합류하는 약 1,927km의 강. 동북평원 북부의 젖줄로, 겨울에는 두껍게 얼어붙는다.\n고대 부여가 이 강 유역을 중심으로 일어났고, 발해의 상경 용천부도 지류 목단강 가에 있었다. 12세기 초 완안부 여진의 아골타가 지류 아십하 가의 회녕에서 금을 세워 요와 북송을 무너뜨렸다. 청대에는 만주족의 발상지로 봉금되었으나, 19세기 말 러시아가 동청철도를 놓으며 강가의 하얼빈을 근대 도시로 키웠다. 하얼빈은 1909년 안중근 의사가 이토 히로부미를 저격한 곳이기도 하다.",paths:[{d:'M 590,148 Q 615,155 635,168 Q 645,172 655,170',stroke:'#7ba8c9',width:3.5}],labels:[{x:615,y:155,size:10,color:'#3a6a95',weight:600,'stroke-width':2.5,tier:3}],tier:3},
{n:'요하',h:'遼河',e:'1,394km · 요동',d:"하북·내몽골에서 발원한 두 물줄기가 합쳐 요동만으로 흘러드는 강. 이 강을 기준으로 동쪽을 요동, 서쪽을 요서라 부른다.\n상류 서요하 유역에서는 BC 4000~3000년경 홍산문화가 번성해 옥룡과 여신묘·적석총을 남겼고, 중국 학계는 이를 ‘요하문명’이라 부른다. 고조선과 연·진·한의 경계가 이 일대였으며, 수·당의 고구려 원정군은 요하를 건너 요동성·안시성을 공격했다. 10세기에는 거란이 서요하 상류 시라무렌강 유역에서 일어났고, 국호 ‘요(遼)’도 이 강 이름과 관련된다. 명대에는 요동도사가 설치되었고, 17세기 누르하치가 요하를 건너 요양·심양을 차지하며 청 건국의 기반을 다졌다.",paths:[{d:'M 580,150 Q 595,180 605,205 Q 610,225 615,238',stroke:'#7ba8c9',width:3}],labels:[{x:600,y:200,size:10,color:'#3a6a95',weight:600,'stroke-width':2.5,tier:3}],tier:3},
{n:'타림강',h:'塔里木河',e:'중국 최장 내륙하 · 2,179km',d:"파미르와 카라코룸에서 발원한 야르칸드강을 원류로, 호탄강·아크수강이 합류해 타클라마칸 사막 북쪽을 동쪽으로 흐르는 중국 최장의 내륙하(약 2,179km). 바다에 이르지 못하고 사막 속으로 사라지며, 예전에는 로프노르 호수로 흘러들었다.\n강을 따라 늘어선 오아시스와 호양나무 숲이 사막을 건너는 대상들의 생명줄이었다. 하류 로프노르 호숫가에는 누란이 번성했으나, 물길이 바뀌고 수량이 줄면서 4세기 무렵 폐허가 되었다. 스웨덴 탐험가 스벤 헤딘은 호수가 주기적으로 자리를 옮긴다는 ‘방황하는 호수’ 가설을 내놓았다. 20세기 상류의 개간과 댐 건설로 하류 수백 km가 말라붙어 로프노르는 완전히 사라졌고, 2000년대부터 생태 복원을 위한 긴급 방류가 이어지고 있다.",paths:[{d:'M 105,222 Q 135,215 165,213 Q 195,215 225,215',stroke:'#7ba8c9',width:3}],labels:[{x:130,y:207,size:10,color:'#3a6a95',weight:600,'stroke-width':2.5,tier:3}],tier:3}
];
const riversG=document.getElementById('cn-rivers');
// 단일 출처화: 실측 하천 경로(GEO_RIVERS)가 있으면 그것을, 없으면 손그림을 쓰되
// 렌더 루프가 하나의 필드(geoPaths)만 읽도록 미리 정규화한다.
const REALRIVER={'황하':'황하','장강 (양자강)':'장강','회하':'회하','송화강':'송화강'};
RIVERS.forEach(r=>{
  const style=r.paths[0]||{};
  const realKey=REALRIVER[r.n], real=realKey&&GEO_RIVERS[realKey];
  if(real&&real.length){
    // 실측 경로: 손그림 색/굵기 스타일만 승계
    r.geoPaths=real.map(d=>({d,stroke:style.stroke||'#5a8fb8',width:style.width||4,linecap:'round'}));
  }else{
    r.geoPaths=r.paths.map(p=>({d:p.d,stroke:p.stroke,width:p.width,dash:p.dash,linecap:p.linecap}));
  }
  // 라벨 위치도 단일화: 실측 라벨좌표(RIVER_LL) 우선, 없으면 손그림 라벨
  const rll=RIVER_LL[r.n], l0=r.labels[0]||{};
  if(rll)r.labelSpec=[{x:rll[0],y:rll[1],size:l0.size||11,color:l0.color||'#3a6a95',weight:l0.weight||700,'stroke-width':l0['stroke-width']||3,tier:l0.tier}];
  else r.labelSpec=r.labels;
});
RIVERS.forEach(r=>{
  const g=group(r,r.tier);
  r.geoPaths.forEach(p=>{
    const a={d:p.d,stroke:p.stroke,'stroke-width':p.width,fill:'none'};
    if(p.dash)a['stroke-dasharray']=p.dash;
    if(p.linecap)a['stroke-linecap']=p.linecap;
    g.appendChild(el('path',a));
  });
  r.labelSpec.forEach(l=>{
    const t=txt(l.x,l.y,r.n,l);
    if(l.tier)t.dataset.tier=l.tier;
    if(l.rot){t.setAttribute('transform',`translate(${l.tx},${l.ty}) rotate(${l.rot})`);t.setAttribute('x',0);t.setAttribute('y',0);}
    g.appendChild(t);
  });
  riversG.appendChild(g);
});

const WALLS=[
{n:'만리장성',h:'萬里長城',e:'진~명 · 21,196km',d:"발해 연안의 산해관에서 감숙 가욕관까지 이어지는, 역대 왕조가 쌓은 성벽의 총칭. 2012년 중국 국가문물국 조사에서 각 시대 성벽을 모두 합친 길이는 21,196km로 발표되었다.\n전국시대 연·조·진 등이 북방 유목민과 이웃 나라를 막으려 각자 쌓은 성벽을, 진 시황이 통일 후 몽염을 보내 흉노를 몰아내고 연결·증축했다. 한 무제는 하서회랑을 차지한 뒤 장성을 돈황 옥문관 너머까지 늘려 실크로드를 보호했다. 이후 북위·북제·수·금 등도 성벽을 쌓았다. 오늘날 보는 벽돌 장성은 대부분 명대 것으로, 1449년 토목의 변에서 황제가 몽골에 사로잡힌 뒤 방어를 크게 강화했고 16세기 척계광 등이 망루를 촘촘히 세웠다. 그러나 1644년 산해관이 열리며 청군이 들어왔듯, 장성은 결국 사람이 지키는 방어선이었다. 1987년 세계문화유산에 등재되었다.",p:'M 218,168 Q 274,152 340,155 Q 410,148 470,152 Q 530,150 590,172',stroke:'#8a6a4a',width:5,dash:'8 3',lx:380,ly:140,ls:12,lc:'#5a3f24',lt:'━ 萬里長城 만리장성 ━',anchor:'middle',tier:1},
{n:'실크로드',h:'絲綢之路 · Silk Road',e:'한 무제 개통 · BC 2세기',d:"중국과 중앙아시아, 서아시아, 지중해 세계를 잇던 동서 교역로의 총칭. ‘비단길’이라는 이름은 19세기 독일 지리학자 리히트호펜이 붙였다. 장안에서 출발해 하서회랑을 지나 돈황에서 천산남로·서역남도·천산북로로 갈라져 파미르를 넘었다.\n한 무제는 흉노를 협공할 동맹을 구하려 장건을 대월지로 보냈고(BC 139 무렵), 13년 만에 돌아온 장건의 보고로 서역의 존재가 알려졌다. 한은 하서사군과 서역도호부를 두어 길을 장악했다. 당대에 교역이 절정에 달해 소그드 상인이 대상을 이끌었고, 비단·도자기·종이가 서쪽으로, 말·옥·향료·유리·포도가 동쪽으로 오갔다. 물건만이 아니라 불교가 전해지고 법현·현장이 인도로 구법 여행을 떠났으며, 조로아스터교·경교·마니교·이슬람도 이 길로 들어왔다. 해상 무역이 커지고 몽골 제국이 무너진 뒤 점차 쇠퇴했다.",p:'M 100,220 Q 150,215 190,205 Q 230,215 265,222 Q 300,235 340,245 Q 370,253 390,260',stroke:'#c07535',width:3.5,dash:'4 3',lx:215,ly:243,ls:11,lc:'#8a4a10',lt:'絲綢之路 실크로드',italic:true,tier:2}
];

const ITEMS=[
{t:'cap',tier:1,x:388,y:260,n:'장안·함양',h:'長安·咸陽 (現 西安)',e:'주·진·한·수·당',d:"위수 남쪽 관중 평원 한가운데 자리한 도시로 오늘날의 서안. 남쪽에 진령, 동쪽에 함곡관·동관, 남쪽에 무관, 서쪽에 산관이 둘러싸 ‘사방이 관문’인 요새 같은 땅이었다.\n주 무왕이 풍경·호경을 세운 이래 진은 위수 북쪽 함양에 도읍해 아방궁과 시황릉을 지었다. 서한은 그 남쪽에 장안성을 쌓았고, 수 문제가 새로 건설한 대흥성을 당이 이어받아 장안이라 불렀다. 당대 장안은 동서 약 9.7km, 남북 약 8.6km의 바둑판 도시로 인구 100만을 헤아렸다. 서시에는 소그드·페르시아 상인이 모였고, 현장은 인도에서 돌아와 대안탑에서 경전을 번역했다. 신라의 최치원, 일본의 아베노 나카마로 같은 유학생도 이곳에서 벼슬했다. 당 말 황소의 난과 주전충의 파괴(904) 이후 다시는 수도가 되지 못했다.",tx:-10,ty:8,ta:'end'},
{t:'cap',tier:1,x:454,y:268,n:'낙양',h:'洛陽',e:'9왕조 도읍',d:"황하 남쪽, 낙수와 이수가 흐르는 분지에 자리한 ‘천하의 중심’. 주 성왕 때 주공이 성주를 경영하며 중요한 도시가 되었고, BC 770년 평왕이 천도하며 동주의 수도가 되었다.\n이후 후한·조위·서진·북위가 도읍했고, 수 양제는 동도를, 무측천은 신도를 두어 사실상 수도로 삼아 흔히 ‘구조고도(九朝古都)’로 불린다. 68년 후한 명제 때 세워진 백마사는 중국 최초의 불교 사찰로 전하고, 북위가 평성에서 천도한 뒤 판 용문석굴은 불교 조각의 보고다. 좌사의 「삼도부」가 인기를 끌어 종잇값이 올랐다는 ‘낙양지귀(洛陽紙貴)’도 서진 낙양의 이야기다. 모란으로 유명하며, 두보·백거이 등 많은 시인이 이곳에서 살았다.",tx:-10,ty:-6,ta:'end'},
{t:'cap',tier:1,x:500,y:285,n:'개봉',h:'開封 · 東京',e:'북송',d:"황하 남쪽 화북평원 한가운데, 대운하(변하)가 지나던 교통 요지. 전국시대 위(魏)의 수도 대량이었고, 오대 후량·후진·후한·후주가 모두 이곳에 도읍했다.\n960년 조광윤이 송을 세우며 동경 개봉부로 삼았다. 방어에 불리한 평지였지만 강남의 물자가 운하로 곧장 닿았기 때문이다. 북송 개봉은 담장으로 구획된 방시제를 벗어나 거리 곳곳에 상점과 야시장, 공연장(와자)이 들어선 상업 도시로, 인구가 100만을 넘었다고 추정된다. 장택단의 「청명상하도」가 그 번화함을 담았다. 1126~1127년 금군이 개봉을 함락하고 휘종·흠종 두 황제를 끌고 간 ‘정강의 변’으로 북송이 멸망했다. 이후 여러 차례 황하 범람에 묻혀, 지금의 개봉 땅 아래에는 여러 시대의 성이 층층이 겹쳐 있다.",tx:10,ty:10,ta:'start'},
{t:'cap',tier:1,x:555,y:205,n:'북경',h:'北京 · 大都 · 燕京',e:'요·금·원·명·청·현대',d:"화북평원 북쪽 끝, 연산산맥 남쪽 기슭에 자리해 초원과 농경지를 잇는 길목. 주대 연(燕)나라의 수도 계(薊)가 그 기원이다.\n10세기 거란의 요가 연운16주를 얻어 남경(배도)으로 삼았고, 금은 1153년 중도로 천도했다. 몽골의 쿠빌라이는 그 동북쪽에 계획도시 대도(칸발릭)를 새로 지어 원의 수도로 삼았다. 명은 처음 남경에 도읍했으나, 연왕 출신 영락제가 1421년 이곳으로 천도하며 자금성과 천단을 지었다. 청도 이를 이어받아 이화원·원명원 등 황실 정원을 조성했다. 1860년 영불 연합군이 원명원을 불태웠고, 1900년 의화단 사건 때는 8개국 연합군이 점령했다. 1928년 국민정부가 남경을 수도로 삼으며 북평으로 바뀌었다가, 1949년 중화인민공화국의 수도가 되었다.",tx:10,ty:-4,ta:'start'},
{t:'cap',tier:1,x:562,y:340,n:'남경',h:'南京 · 建康',e:'육조·명 초·중화민국',d:"장강 하류 남안, 종산이 용처럼 서리고 석두성이 범처럼 웅크렸다는 ‘용반호거(龍盤虎踞)’의 땅. 229년 오의 손권이 건업으로 도읍한 이래 동진·송·제·양·진이 건강이라는 이름으로 수도로 삼아 ‘육조고도’로 불린다.\n육조 시대 건강은 북방에서 내려온 귀족 문화와 불교가 꽃핀 남조 문화의 중심이었다. 수가 589년 진을 멸하며 철저히 파괴했으나, 10세기 남당의 수도로 되살아났다. 1368년 주원장이 이곳에서 명을 세우고 둘레 약 35km의 거대한 성벽을 쌓았다. 1842년 영국과 맺은 남경조약은 중국 근대사의 시작을 알렸고, 태평천국은 천경이라 부르며 11년간 수도로 삼았다. 1912년 쑨원이 중화민국 임시정부를 세웠으며, 1937년 12월 일본군이 점령해 대규모 학살을 저질렀다.",tx:10,ty:4,ta:'start'},
{t:'cap',tier:1,x:597,y:386,n:'항주',h:'杭州 · 臨安',e:'오월·남송',d:"전당강 하구, 대운하의 남쪽 끝에 자리한 도시. 서호를 품은 풍광으로 ‘하늘에는 천당, 땅에는 소주·항주’라 불렸다.\n수대 운하 개통 이후 크게 성장했고, 10세기 오월국의 전류가 도읍하며 해당(방조제)을 쌓고 불교를 장려했다. 정강의 변 후 남쪽으로 내려온 송 고종은 1138년 항주를 행재소 임안부로 정했고, 이후 140년 가까이 남송의 수도였다. 인구 100만이 넘는 상업 도시로 성장했으며, 원대에 이곳을 찾은 마르코 폴로는 ‘킨사이(행재)’라 부르며 세상에서 가장 훌륭한 도시라 기록했다. 백거이와 소식이 지방관으로 있으면서 서호에 둑을 쌓아 백제·소제가 남았다. 용정차와 비단으로도 이름높다.",tx:10,ty:4,ta:'start'},
{t:'cap',tier:1,x:305,y:340,n:'성도',h:'成都',e:'촉한·전촉·후촉',d:"사천분지 서부 성도평원의 중심 도시. 주 태왕이 옮겨 가자 ‘1년 만에 마을, 2년 만에 읍, 3년 만에 도시를 이루었다(三年成都)’는 고사에서 이름이 왔다고 전한다.\nBC 3세기 진의 이빙이 도강언을 쌓아 평원을 옥토로 만든 뒤 풍요의 상징이 되었다. 한대에는 비단 직조가 번성해 ‘금관성(錦官城)’으로 불렸다. 221년 유비가 이곳에서 촉한을 세웠고 제갈량이 승상으로 다스렸으며, 무후사에 둘을 함께 모셨다. 당 현종은 안사의 난 때 이곳으로 피란했고, 두보는 전란을 피해 초당을 짓고 240여 수의 시를 남겼다. 10세기 전촉·후촉의 수도였으며, 북송 때 세계 최초의 지폐 교자가 이곳 상인들 사이에서 생겨났다.",tx:-10,ty:4,ta:'end'},
{t:'cap',tier:1,x:465,y:190,n:'평성·대동',h:'平城 · 大同',e:'북위 (398~494)',d:"산서 북단, 몽골 초원과 화북을 잇는 길목. 한 고조 유방이 흉노에게 7일간 포위당한 ‘백등산 포위(BC 200)’가 바로 이 근처에서 벌어졌다.\n선비족 탁발부가 세운 북위는 398년 도무제 때 이곳을 평성이라 부르며 수도로 삼았고, 이후 100년 가까이 화북을 통일한 북방 왕조의 중심이었다. 460년 무렵 승려 담요의 건의로 서쪽 무주산 절벽에 운강석굴을 파기 시작했는데, 거대한 불상은 역대 황제의 모습을 본떴다고 한다. 494년 효문제가 한화 정책을 추진하며 낙양으로 천도하자 쇠퇴했다. 요·금대에는 서경 대동부로 다시 중요해졌고, 명대에는 몽골을 막는 구변진의 하나로 강력한 성벽이 둘러싸였다.",tx:0,ty:-10,ta:'middle'},
{t:'cap',tier:1,x:513,y:250,n:'업성',h:'鄴 · 鄴城',e:'조위·후조·전연·동위·북제',d:"황하 북쪽, 오늘날 하북 임장현과 하남 안양 경계의 옛 도시. 전국시대 위(魏)의 서문표가 ‘하백에게 신부 바치기’ 풍습을 없애고 수로를 놓아 다스린 곳으로 유명하다.\n204년 조조가 원소의 아들들을 몰아내고 업을 차지해 위공·위왕의 근거지로 삼았다. 동작대·금호대·빙정대의 삼대를 쌓았고, 아들 조식이 「동작대부」를 지었다. 조조 부자와 건안칠자가 모여 ‘건안문학’을 꽃피운 무대였다. 이후 후조·염위·전연·동위·북제가 잇달아 수도로 삼아 북중국의 중심 도시였다. 580년 북주의 양견(훗날 수 문제)이 반란을 진압하며 성을 불태우고 주민을 안양으로 옮기면서 역사에서 사라졌다.",tx:10,ty:-6,ta:'start'},
{t:'cap',tier:1,x:605,y:170,n:'심양·성경',h:'瀋陽 · 盛京 · 奉天',e:'후금(청) 초기',d:"요녕성 혼하 북쪽에 자리한 동북 최대 도시. 이름은 혼하의 옛 이름 심수(瀋水)의 북쪽이라는 뜻이다.\n1616년 후금을 세운 누르하치는 명과 싸워 요동을 차지한 뒤 1625년 이곳으로 도읍을 옮기고 궁궐을 짓기 시작했다. 아들 홍타이지는 1634년 성경으로 이름을 바꾸고 1636년 국호를 청으로 고쳤다. 같은 해 병자호란을 일으켜 조선의 항복을 받았고, 소현세자와 봉림대군이 이곳에 볼모로 잡혀 왔다. 1644년 입관해 북경으로 옮긴 뒤에도 배도로 유지되었으며, 심양 고궁은 북경 자금성과 함께 세계문화유산이다. 1931년 류탸오후 사건(만주사변)의 현장이기도 하다.",tx:8,ty:0,ta:'start'},
{t:'city',tier:2,x:490,y:238,n:'은허',h:'殷墟 · 安陽',e:'상 후기',d:"하남 안양 서북쪽 원하 양안에 있는 상(商) 후기의 도읍 유적. 반경이 이곳으로 천도한 뒤 주왕이 멸망할 때까지 약 273년간 수도였다고 전한다.\n1899년 금석학자 왕의영이 약재로 팔리던 ‘용골’에 새겨진 글자를 알아보면서 갑골문이 세상에 알려졌다. 1928년부터 본격 발굴이 이루어져 왕릉·궁전 터와 함께 갑골 15만 점 이상이 출토되었고, 전설로 여겨지던 상 왕조가 실재했음이 확인되었다. 갑골문은 왕이 제사·전쟁·날씨를 점친 기록으로 한자의 직접적인 조상이다. 무게 800kg이 넘는 후모무정(사모무정)과, 여성 장군이었던 왕비 부호의 무덤도 이곳에서 나왔다. 2006년 세계문화유산에 등재되었다.",tx:12,ty:4,ta:'start'},
{t:'city',tier:2,x:590,y:365,n:'소주',h:'蘇州',e:'춘추 오·명·청',d:"태호 동쪽, 대운하가 도심을 지나는 강남 수향의 대표 도시. BC 514년 오왕 합려가 오자서에게 명해 성을 쌓은 것이 시작으로, 2,500년 넘게 거의 같은 자리에 도시가 이어졌다.\n춘추시대 오의 수도로, 합려·부차와 월왕 구천의 ‘와신상담’ 이야기의 무대다. 수대 운하 개통 뒤 강남 곡물의 집산지로 번영했고, 명·청대에는 비단 직조와 상업, 학문의 중심으로 과거 급제자를 가장 많이 배출한 고장이었다. 은퇴한 관료와 부유한 상인들이 지은 사가 원림이 많아 졸정원·유원·망사원 등 9곳이 세계문화유산에 올랐다. 당 시인 장계의 「풍교야박」에 나오는 한산사의 종소리도 유명하다.",tx:-8,ty:-3,ta:'end'},
{t:'city',tier:2,x:355,y:358,n:'중경',h:'重慶',e:'파국·근현대',d:"장강과 가릉강이 만나는 반도 위의 산악 도시. 고대 파국의 중심지로 강주·유주·공주로 불리다가, 1189년 남송 광종이 공왕에서 황제에 즉위하며 ‘경사가 겹쳤다’는 뜻의 중경으로 이름이 바뀌었다.\n13세기 몽골이 사천을 침공하자 남송은 중경과 합천의 조어성을 중심으로 산성 방어선을 구축해 수십 년을 버텼다. 1891년 개항한 뒤 장강 상류의 무역 중심이 되었다. 중일전쟁 중 국민정부가 1938년부터 전시 수도로 삼았고, 일본군은 1938~1943년 끈질긴 폭격을 퍼부었다. 대한민국 임시정부도 1940년부터 광복 때까지 이곳에 청사를 두었다. 안개가 잦고 여름이 무더워 ‘화로’라 불린다.",tx:10,ty:4,ta:'start'},
{t:'city',tier:2,x:465,y:383,n:'형주·무한',h:'荊州 · 武漢',e:'초·삼국·근대',d:"장강 중류의 두 요충. 형주(강릉)는 춘추전국시대 초의 도읍 영(郢)이 있던 곳으로, 굴원이 활동한 초 문화의 중심이었다.\n삼국시대 형주는 위·촉·오가 모두 탐낸 땅이었다. 적벽대전 후 유비가 형주를 빌려 촉 진출의 발판으로 삼았고, 219년 관우가 북진한 틈을 타 오의 여몽이 형주를 기습해 관우는 목숨을 잃었다. 하류의 무한은 장강과 한수가 만나는 곳에 무창·한구·한양 세 도시가 마주 선 교통 중심지로, ‘아홉 성으로 통하는 길목(九省通衢)’이라 불렸다. 1911년 10월 10일 무창의 신군이 봉기해 신해혁명이 시작되었고, 이날은 지금도 쌍십절로 기념된다.",tx:10,ty:-4,ta:'start'},
{t:'city',tier:2,x:495,y:458,n:'광주',h:'廣州 · 番禺',e:'남월·당~현대',d:"주강 삼각주 북단, 남중국해로 나가는 관문. 진 시황의 영남 정벌 뒤 남해군의 치소 번우가 세워졌고, BC 203년 조타가 남월국을 세워 수도로 삼았다. 도심에서는 남월왕 조말의 무덤이 발굴되어 옥 수의와 금인이 나왔다.\n당대에는 아랍·페르시아 상인이 모여 사는 번방이 있을 만큼 국제적인 항구였고, 무역을 관리하는 시박사가 일찍부터 설치되었다. 청은 1757년 서양과의 무역을 광주 한 곳에서만 허용하고 13행 상인에게 독점시켰다(광동 체제). 1839년 임칙서가 이곳에서 아편을 몰수·폐기한 것이 아편전쟁으로 이어졌다. 쑨원이 활동한 혁명의 근거지로, 황포군관학교가 세워지고 1926년 북벌이 시작되었다.",tx:8,ty:4,ta:'start'},
{t:'city',tier:2,x:443,y:218,n:'태원',h:'太原',e:'춘추 진·당 발상지',d:"산서 중부 분수 유역의 분지 도시. 춘추시대 진(晉)의 땅으로, 조씨가 진양성을 쌓았고 BC 453년 조·한·위가 지백을 멸한 진양 전투가 여기서 벌어져 삼진 분립의 계기가 되었다.\n617년 태원유수 이연이 아들 이세민과 함께 이곳에서 군사를 일으켜 장안을 점령하고 당을 세웠다. 그래서 당은 태원을 ‘북도’로 우대했다. 오대에는 후당·후진·후한을 세운 사타족 군벌의 근거지였고, 마지막까지 남은 북한(北漢)의 수도였다. 979년 송 태종이 북한을 멸하면서 오래 버틴 진양성을 불태우고 물을 끌어 잠기게 했다. 인근의 진사(晉祠)는 송대 성모전과 조각으로 유명하다.",tx:-10,ty:-4,ta:'end'},
{t:'city',tier:2,x:322,y:242,n:'란주',h:'蘭州 · 金城',e:'한~현대',d:"감숙 중부, 황하가 도심을 가로지르는 도시로 황하가 관통하는 유일한 성도(省都)다. 동쪽 관중과 서쪽 하서회랑을 잇는 목이어서 실크로드와 역대 서북 경영의 거점이 되었다.\n한 무제가 흉노를 몰아낸 뒤 이 일대를 차지했고, BC 81년 소제 때 금성군이 설치되어 ‘금성’이라는 옛 이름이 생겼다. 5호 16국 시대에는 선비계 서진(西秦) 등이 이 일대에 도읍했다. 수대에 란주라는 이름이 붙었으며, 황하 나루가 중요해 명대에 배를 이은 부교가 놓였고, 1909년 독일 기술로 황하 최초의 철교인 중산교가 세워졌다. 소고기 국수(란주 우육면)로도 유명하다.",tx:-8,ty:4,ta:'end'},
{t:'city',tier:2,x:450,y:412,n:'장사',h:'長沙',e:'초·근현대',d:"호남 동부 상강 하류에 자리한 성도. 전국시대 초의 남방 거점이었고, 한 초에는 장사국이 봉해졌다.\n1972~1974년 동쪽 교외의 마왕퇴에서 서한 장사국 승상 이창과 그 아내 신추 부인의 무덤이 발굴되었다. 2천 년이 넘었는데도 피부에 탄력이 남아 있던 신추 부인의 시신, 무게 49g의 얇은 비단옷, 『노자』와 의학서가 적힌 백서 등이 세상을 놀라게 했다. 한 문제 때 가의가 장사왕의 태부로 좌천되어 「조굴원부」를 지은 곳이기도 하다. 송대에는 주희·장식이 강학한 악록서원이 학문의 중심이었다. 근대에는 증국번·좌종당 등 호남 출신 인사가 두각을 나타냈고, 청년 마오쩌둥이 이곳 제일사범학교에서 공부했다.",tx:10,ty:4,ta:'start'},
{t:'city',tier:2,x:525,y:262,n:'곡부',h:'曲阜',e:'노(魯)·주(周) 봉국',d:"산동 서남부 태산 남쪽의 작은 도시. 주 무왕의 동생 주공 단이 봉해진 노(魯)나라의 수도로, 주의 예악 문화를 가장 잘 간직한 나라였다.\nBC 551년 공자가 이곳 인근에서 태어나 제자를 가르쳤고, 노나라 역사를 정리한 『춘추』를 남겼다. 공자 사후 그의 옛집은 사당이 되었고, 역대 왕조가 확장해 자금성 다음가는 규모의 공묘(孔廟)가 되었다. 공자의 직계 후손 연성공이 살던 공부(孔府), 공씨 일족의 묘역 공림(孔林)과 함께 ‘삼공’으로 불리며 1994년 세계문화유산에 등재되었다. 맹자의 고향 추성도 가까워 이 일대를 ‘공맹지향’이라 부른다. 문화대혁명 때는 홍위병이 공림을 파헤치는 수난도 겪었다.",tx:10,ty:4,ta:'start'},
{t:'city',tier:2,x:540,y:322,n:'양주',h:'揚州',e:'수·당·명·청',d:"장강 북안, 대운하가 장강과 만나는 교차점. BC 486년 오왕 부차가 한구를 파고 한성을 쌓은 것이 시작이다.\n수 양제는 이곳을 강도라 부르며 세 차례 행차했고, 618년 이곳에서 부하 우문화급에게 살해당했다. 당대에는 ‘양일익이(揚一益二)’, 즉 천하 제일의 도시는 양주, 둘째는 익주(성도)라 할 만큼 번성했으며 신라와 아랍 상인도 많았다. 신라의 최치원이 회남절도사 고변의 막료로 「토황소격문」을 지은 곳이 바로 양주다. 대명사의 승려 감진은 이곳에서 일본으로 떠났다. 명·청대에는 소금 전매를 맡은 염상들의 부로 원림과 요리 문화가 꽃피었으나, 1645년 청군의 ‘양주 10일’ 학살을 겪었다.",tx:8,ty:-3,ta:'start'},
{t:'city',tier:2,x:580,y:435,n:'천주',h:'泉州 · 刺桐',e:'송·원 해상 실크로드',d:"복건 남부 진강 하구의 항구 도시. 성 둘레에 자동(刺桐)나무를 많이 심어 아랍인들은 ‘자이툰’이라 불렀다.\n1087년 시박사가 설치된 뒤 송·원대에 광주를 제치고 세계 최대급 무역항으로 성장했다. 도자기·비단·차가 동남아·인도·아랍으로 나가고 향료·약재가 들어왔다. 마르코 폴로와 이븐 바투타가 모두 이 항구의 규모에 감탄하는 기록을 남겼다. 이슬람 사원 청정사, 힌두 사원 조각, 마니교의 초암, 경교 묘비 등이 함께 남아 다양한 종교와 민족이 공존했음을 보여 준다. 명의 해금 정책 이후 쇠퇴했고, 2021년 송·원대 세계 해양 무역 중심지로서 세계문화유산에 등재되었다.",tx:8,ty:4,ta:'start'},
{t:'city',tier:2,x:293,y:397,n:'대리',h:'大理',e:'남조·대리국 (738~1253)',d:"운남 서부 창산과 이해(洱海) 사이에 자리한 고도. 8세기 전반 여섯 부족(육조) 가운데 남쪽의 몽사조가 나머지를 통합해 남조를 세우고 이곳에 도읍했다.\n남조는 당과 토번 사이에서 줄타기를 하며 세력을 키워, 751년과 754년 당의 원정군을 크게 격파했다. 937년 단사평이 대리국을 세워 300여 년간 독립 왕국을 유지했다. 불교를 깊이 믿어 여러 국왕이 출가했고, 숭성사 삼탑이 그 상징이다. 1253년 쿠빌라이가 몽골군을 이끌고 금사강을 가죽 뗏목으로 건너 대리를 정복해, 남송을 남쪽에서 포위하는 발판으로 삼았다. 오늘날에도 백족 문화의 중심지다.",tx:-8,ty:4,ta:'end'},
{t:'city',tier:2,x:183,y:315,n:'라싸',h:'拉薩 · 邏些',e:'토번 · 티베트',d:"청장고원 남부, 얄룽창포강의 지류 키추강 가 해발 약 3,650m에 자리한 티베트의 중심 도시. 이름은 ‘신들의 땅’이라는 뜻이다.\n7세기 송첸캄포가 토번을 통일하고 이곳을 수도로 삼았다. 그는 네팔의 브리쿠티 공주와 당의 문성공주를 맞아들였고, 두 왕비가 가져온 불상을 모시려 조캉 사원(대소사)과 라모체를 세웠다고 전한다. 821~822년 당과 토번이 맺은 장경회맹비가 지금도 조캉 앞에 서 있다. 17세기 달라이 라마 5세가 겔룩파 정권을 세우고 마르포리 언덕 위에 포탈라궁을 재건했다. 청은 1727년 주장대신을 두어 감독했고, 1951년 중화인민공화국에 편입되었다. 1959년 봉기 후 달라이 라마 14세가 인도로 망명했다.",tx:8,ty:4,ta:'start'},
{t:'city',tier:2,x:620,y:368,n:'상해',h:'上海 · 滬',e:'근현대',d:"장강 하구 남쪽, 황포강 가의 도시. 송대에 진(鎭)이 설치되고 1292년 현이 된, 원래는 크지 않은 항구였다.\n1842년 남경조약으로 개항이 정해져 이듬해 문을 열었고, 영국·미국·프랑스 조계가 설정되면서 급속히 성장했다. 황포강 서안의 와이탄에는 은행과 상사 건물이 늘어섰고, 20세기 초 ‘동양의 파리’로 불리는 아시아 최대의 금융·상업 도시가 되었다. 1919년 대한민국 임시정부가 이곳 프랑스 조계에서 수립되었고, 1921년 중국 공산당 제1차 전국대표대회가 열렸다. 1932년 윤봉길 의사가 훙커우 공원에서 의거를 일으켰다. 1937년 치열한 상해 전투 끝에 일본군에 점령되었고, 1990년 푸둥 개발 이후 다시 중국 경제의 중심이 되었다.",tx:8,ty:4,ta:'start'},
{t:'silk',tier:3,x:245,y:213,n:'돈황',h:'敦煌',e:'한~원',d:"하서회랑 서쪽 끝, 사막 가장자리의 오아시스 도시. 한 무제가 하서사군(무위·장액·주천·돈황)을 두면서 설치되었고, 서쪽의 옥문관·양관을 관할하며 서역으로 나가는 마지막 관문이 되었다.\n366년 승려 낙준이 명사산 동쪽 절벽에 처음 굴을 판 이래 원대까지 약 1천 년 동안 석굴이 조성되어, 막고굴에는 735개 굴과 약 4만 5천 m²의 벽화가 남아 있다. 1900년 도사 왕원록이 모래를 치우다 봉해진 장경동(제17굴)을 발견했는데, 한문·티베트어·소그드어 등으로 된 문서 약 5만 점이 들어 있었다. 스타인·펠리오 등이 이를 헐값에 사들여 해외로 가져갔고, 그중에는 신라 승려 혜초의 『왕오천축국전』도 있었다. 1987년 세계문화유산에 등재되었다.",tx:8,ty:4,ta:'start'},
{t:'silk',tier:3,x:198,y:195,n:'하미',h:'哈密',e:'한~청',d:"천산 동쪽 끝 남쪽의 오아시스로, 하서회랑에서 서역으로 들어서면 처음 만나는 땅. 한대에는 이오(伊吾)라 불렸다.\n73년 후한의 두고가 흉노를 치고 이곳을 차지해 둔전을 두었으며, 이때 종군한 반초가 서역 경영을 시작했다. 당대에는 이주(伊州)가 설치되었다. 현장은 629년 사막을 건너다 물을 잃고 사경을 헤맨 끝에 이곳에 닿아 목숨을 건졌다. 명대에는 칭기즈 칸 후손이 다스리는 합밀위가 있었다. 청대에는 준가르와의 전쟁에서 보급 기지가 되었고, 현지 위구르 수장은 하미왕으로 봉해져 1930년대까지 이어졌다. 달고 향기로운 하미과(참외)가 유명하다.",tx:-8,ty:-3,ta:'end'},
{t:'silk',tier:3,x:145,y:172,n:'우루무치',h:'烏魯木齊',e:'청~현대',d:"천산 북쪽 기슭, 준가르 분지 남단의 도시. 이름은 몽골어로 ‘아름다운 목장’이라는 뜻으로 알려져 있다.\n당대에는 북정도호부 관할 아래 천산북로의 길목이었으나, 오랫동안 유목민의 초지였다. 17~18세기 이곳을 차지한 오이라트계 준가르가 청과 70년 가까이 대립했다. 건륭제는 1755~1759년 준가르와 타림분지의 호자 세력을 평정하고 이 땅을 ‘새로운 강역’이라는 뜻의 신강으로 삼았다. 1763년 성을 쌓아 적화(迪化)라 불렀고, 1884년 신강성이 설치되자 그 성도가 되었다. 1954년 우루무치라는 이름을 되찾았으며, 세계에서 바다와 가장 멀리 떨어진 대도시로 꼽힌다.",tx:8,ty:-3,ta:'start'},
{t:'silk',tier:3,x:100,y:220,n:'카슈가르',h:'喀什 · 疏勒',e:'한~현대',d:"타림분지 서쪽 끝, 파미르 고원 동쪽 기슭의 오아시스 도시. 중국 이름은 카스(喀什), 한대에는 소륵국이었다. 천산남로와 서역남도가 모여 파미르를 넘는 길목이어서, 서쪽으로 페르가나·사마르칸트와 이어졌다.\n후한의 반초는 이 일대를 근거지로 서역 50여 나라를 복속시켰다. 당대에는 안서도호부 아래 4진의 하나인 소륵진이 설치되었다. 10세기 카라한 왕조가 이슬람으로 개종하면서 중앙아시아 투르크 이슬람 문화의 중심이 되었고, 이곳 출신 마흐무드 카슈가리는 최초의 투르크어 사전을 편찬했다. 1865년 야쿠브 벡이 독립 정권을 세웠으나 1878년 좌종당의 청군이 되찾았다. 이드카 모스크와 옛 시가지가 위구르 문화의 상징이다.",tx:8,ty:4,ta:'start'},
{t:'silk',tier:3,x:168,y:190,n:'투루판',h:'吐魯番',e:'한~원',d:"천산 남쪽의 분지로, 가장 낮은 아이딩호는 해수면 아래 약 154m다. 여름 최고 기온이 45℃를 넘어 ‘불의 땅’이라 불리며, 『서유기』의 화염산도 이곳에 있다.\n한대의 차사전국이 있었고, 5~7세기에는 한인 국씨가 다스린 고창국이 번영했다. 현장은 인도로 가는 길에 고창왕 국문태의 극진한 대접을 받았다. 640년 당 태종이 고창을 멸하고 서주를 두었으며, 처음 설치한 안서도호부도 이곳에 있었다. 9세기 몽골고원에서 밀려난 위구르가 이주해 서위구르 왕국을 세우고 불교·마니교 문화를 꽃피웠다. 고창고성·교하고성과 베제클리크 천불동이 남아 있다. 지하 수로 카레즈로 천산의 눈 녹은 물을 끌어 포도와 건포도가 유명하다.",tx:-6,ty:-3,ta:'end'},
{t:'fort',tier:2,x:610,y:198,n:'산해관',h:'山海關',e:'명 · 만리장성 동단',d:"연산산맥이 발해에 닿는 좁은 회랑에 자리해 ‘산과 바다 사이의 관문’이라는 이름을 얻었다. 명대 만리장성의 동쪽 기점으로 알려져 있으며, 성벽 끝이 바다로 들어가는 곳은 ‘노룡두(늙은 용의 머리)’라 불린다.\n1381년 명의 대장군 서달이 관을 쌓고 위(衛)를 두었다. 동쪽 성루에는 ‘천하제일관’ 편액이 걸려 있다. 화북과 요동을 잇는 거의 유일한 평지 통로여서 명 말 후금·청과의 대결에서 최후의 방어선이 되었다. 1644년 이자성이 북경을 함락하자, 산해관을 지키던 오삼계는 청의 도르곤에게 투항해 관문을 열었고 연합군이 일편석 전투에서 이자성을 격파했다. 이것이 청이 중원을 차지하는 ‘입관’의 결정적 계기가 되었다.",tx:8,ty:-3,ta:'start'},
{t:'fort',tier:2,x:540,y:198,n:'거용관',h:'居庸關',e:'북경 방어',d:"북경 서북쪽 약 50km, 군도산 협곡 속 약 18km의 골짜기에 자리한 관문. 태행산맥을 넘는 여덟 통로(태행팔형) 중 마지막 군도형으로, 몽골고원에서 북경으로 들어오는 가장 중요한 길을 막는다.\n진 시황이 장성을 쌓을 때 죄수와 인부를 이곳에 머물게 해 이름이 생겼다고 전한다. 1213년 칭기즈 칸은 정면 공격이 막히자 샛길로 돌아 거용관을 함락하고 금의 중도를 포위했다. 원대 1342~1345년 관 안에 세운 운대의 문 안쪽에는 산스크리트·티베트·파스파·위구르·서하·한자 6종 문자의 불경이 새겨져 있다. 명대에는 팔달령과 함께 수도 방어의 핵심으로 겹겹이 성벽을 둘렀다. 연경팔경의 하나인 ‘거용첩취’로도 이름난 경승지다.",tx:-8,ty:-3,ta:'end'},
{t:'fort',tier:2,x:455,y:200,n:'안문관',h:'雁門關',e:'조·한~명',d:"산서 북부 구주산 위, 두 봉우리가 문처럼 마주 보고 기러기가 그 사이로 날아간다고 해서 이름 붙은 관문. 태원·중원과 대동·몽골 초원을 가르는 요충으로 ‘천하 구새(九塞)의 으뜸’으로 불렸다.\n전국시대 조의 명장 이목이 이 일대에서 흉노 10만여 기를 격파했다. BC 133년 한 무제는 인근 마읍에 흉노 선우를 유인해 매복하는 작전을 폈으나 발각되었고, 이후 한과 흉노의 전면전이 시작되었다. 615년 수 양제는 북방 순행 중 돌궐의 시필 가한에게 안문군에서 포위당해 곤경을 겪었다. 북송 때는 양업 일가(양가장)가 이곳을 지키며 요와 싸운 이야기가 소설과 경극으로 전해진다. 지금의 성벽은 명대에 다시 쌓은 것이다.",tx:0,ty:-8,ta:'middle'},
{t:'fort',tier:2,x:275,y:200,n:'가욕관',h:'嘉峪關',e:'명 · 만리장성 서단',d:"하서회랑 서쪽, 기련산과 흑산 사이 가장 좁은 곳에 자리한 명대 만리장성의 서쪽 끝 관문. 성루에 ‘천하웅관’ 편액이 걸려 흔히 ‘천하제일웅관’이라 부른다.\n1372년 명의 장수 풍승이 하서를 평정한 뒤 쌓기 시작했고, 16세기에 외성과 망루가 보강되어 내성·외성·옹성이 겹친 견고한 요새가 되었다. 명은 가욕관 서쪽을 사실상 포기했기 때문에, 이 관문 밖으로 나가는 것은 곧 중국 밖으로 나가는 것을 뜻했다. 성을 쌓을 때 벽돌 수를 정확히 계산해 한 장만 남았다는 전설의 ‘정성전(定城磚)’이 서옹성 문루에 놓여 있다. 청대 신강으로 유배 가던 임칙서 등도 이 관문을 지나며 시를 남겼다.",tx:8,ty:-3,ta:'start'},
{t:'fort',tier:2,x:230,y:207,n:'옥문관',h:'玉門關',e:'한 무제',d:"돈황 서북쪽 약 90km, 한 무제가 하서사군을 두면서 세운 관문. 호탄 등 서역에서 나는 옥이 이 문을 거쳐 중원으로 들어왔다고 해서 이름이 붙었다.\n양관과 함께 한대 서역으로 나가는 두 관문으로, 옥문관은 천산남로로 이어지는 북쪽 길을 맡았다. 장건의 뒤를 이은 사신들과 이광리의 대원 원정군이 이곳을 지났고, 30년 넘게 서역에서 활약한 후한의 반초는 늘그막에 ‘살아서 옥문관에 들어가기만을 바란다’는 상소를 올렸다. 당대 왕지환의 「양주사」는 ‘봄바람이 옥문관을 넘지 못한다’고 노래해 변방의 쓸쓸함을 상징하게 되었다. 지금 남아 있는 흙 성채 소방반성이 옥문관 터로 알려져 있으며, 실크로드 유산으로 세계문화유산에 포함되었다.",tx:-8,ty:-3,ta:'end'},
{t:'fort',tier:2,x:235,y:225,n:'양관',h:'陽關',e:'한 무제',d:"돈황 서남쪽 약 70km, 옥문관의 남쪽(陽)에 있다고 해서 이름 붙은 관문. 서역남도, 즉 곤륜산 북쪽 기슭을 따라 누란·호탄으로 가는 길의 출발점이었다.\n한 무제 때 옥문관과 함께 세워져 서역 사신과 상인, 군대가 드나들었고, 법현 같은 구법승도 이 길을 지났다. 당대 왕유가 친구 원이를 안서로 떠나보내며 지은 「송원이사안서」의 마지막 구절 ‘서쪽으로 양관을 나서면 아는 이 없으리’는 이별의 노래로 널리 불려 ‘양관삼첩’이라는 곡이 되었다. 송대 이후 서역 교통이 쇠퇴하며 관은 모래에 묻혔고, 지금은 모래밭과 한대 봉수대 하나만 남아 있다.",tx:-8,ty:4,ta:'end'},
{t:'fort',tier:2,x:430,y:262,n:'함곡관',h:'函谷關',e:'전국~한',d:"하남 영보 서남쪽, 골짜기가 상자(函)처럼 좁고 깊다 하여 이름이 붙은 관문. 동쪽의 중원과 서쪽의 관중을 잇는 길목이어서, ‘관중’이라는 말 자체가 이 관문의 안쪽을 뜻했다.\n전국시대 진은 이 관문 하나에 의지해 동방 6국의 연합군을 여러 차례 막아 냈다. BC 318년과 BC 241년의 합종군이 모두 함곡관 앞에서 발길을 돌렸다. 제의 맹상군이 진에서 도망칠 때 닭 울음소리를 흉내 낸 식객 덕분에 한밤중 관문을 빠져나왔다는 ‘계명구도(鷄鳴狗盜)’의 무대이기도 하다. 노자가 서쪽으로 떠나다 관령 윤희의 청으로 『도덕경』 5천 자를 남겼다는 전설도 전한다. 한 무제 때 관을 동쪽 신안으로 옮기면서 새 함곡관이 생겼다.",tx:-8,ty:-6,ta:'end'},
{t:'fort',tier:2,x:418,y:275,n:'동관',h:'潼關',e:'후한~명',d:"섬서 동쪽 끝, 황하가 남쪽으로 흐르다 위수를 받아 동쪽으로 꺾이는 곳에 자리한 관문. 후한 말 함곡관을 대신해 관중의 동쪽 대문이 되었다.\n211년 조조가 마초·한수의 서량 연합군과 싸운 동관 전투의 현장으로, 조조는 강을 건너다 위기를 맞았으나 이간책으로 적을 무너뜨렸다. 756년 안녹산의 반란군이 밀려오자 노장 가서한은 관을 굳게 지키자고 했으나, 양국충에게 떠밀린 현종의 명으로 출격했다가 영보에서 대패했다. 동관이 무너지자 현종은 장안을 버리고 촉으로 피란했고, 도중 마외역에서 양귀비가 죽임을 당했다. 이후 명·청대까지 ‘관중의 목구멍’으로 중시되었다.",tx:8,ty:8,ta:'start'},
{t:'fort',tier:2,x:395,y:290,n:'무관',h:'武關',e:'전국~한',d:"섬서 상락 동남쪽 단수 계곡에 자리한 관중의 동남쪽 관문. 남양분지를 거쳐 초나라 땅으로 이어지는 길을 지켰다.\nBC 299년 진 소양왕은 초 회왕을 무관으로 불러 회맹하자고 속여 붙잡았고, 회왕은 끝내 진에서 죽었다. 이 일로 초나라 사람들의 원한이 깊어져 ‘초가 비록 세 집만 남아도 진을 멸할 것은 반드시 초’라는 말이 생겼다. 그 말처럼 BC 207년 초의 장수 유방은 항우가 진의 주력과 싸우는 사이 무관을 돌파해 관중으로 들어갔고, 이듬해 진왕 자영이 항복하면서 진이 멸망했다. 함곡관·소관·산관과 함께 ‘관중 4관’으로 꼽힌다.",tx:-6,ty:10,ta:'end'},
{t:'fort',tier:2,x:322,y:315,n:'검문관',h:'劍門關',e:'삼국~',d:"사천 북부 검각현, 대검산의 72봉이 칼처럼 늘어선 절벽 사이 좁은 틈에 세운 관문. 관중에서 촉으로 들어가는 금우도의 가장 험한 목이다.\n촉한의 제갈량이 이곳 절벽에 잔도를 놓고 관을 세웠다고 전한다. 263년 위의 종회가 대군을 이끌고 쳐들어오자 강유가 검문관을 지켜 끝내 뚫리지 않았으나, 등애가 음평의 샛길로 돌아 성도를 기습하는 바람에 후주 유선이 항복했다. 이백은 「촉도난」에서 ‘한 사람이 관을 지키면 만 명도 열지 못한다(一夫當關 萬夫莫開)’고 이 관을 노래했다. 이후에도 촉을 지키는 마지막 관문으로 여러 전쟁의 무대가 되었다.",tx:-8,ty:4,ta:'end'},
{t:'fort',tier:2,x:378,y:353,n:'조어성',h:'釣魚城',e:'남송 vs 몽골',d:"중경 합천의 조어산 위, 가릉강·거강·부강 세 물줄기에 둘러싸인 절벽 산성. 1243년 남송의 사천 안무사 여개가 쌓아, 군민이 성안에서 농사를 지으며 장기전을 버티게 했다.\n1259년 몽골의 대칸 몽케가 직접 대군을 이끌고 공격했으나 수장 왕견의 수비군에게 막혔고, 몽케는 성 아래 진중에서 죽었다(부상설·병사설이 있다). 이 소식에 서아시아를 원정 중이던 훌라구가 주력을 이끌고 돌아섰고, 쿠빌라이와 아릭부케의 계승 분쟁이 벌어지면서 몽골의 확장 방향이 크게 바뀌었다. 그래서 ‘신의 채찍이 꺾인 곳’, ‘세계사를 바꾼 성’으로 불린다. 조어성은 남송이 멸망하는 1279년까지 36년 동안 버티다 성민의 안전을 조건으로 항복했다.",tx:8,ty:4,ta:'start'},
{t:'fort',tier:2,x:475,y:370,n:'양양성',h:'襄陽城',e:'남송 vs 몽골',d:"호북 북부 한수 남안의 성으로, 강 건너 번성과 짝을 이룬다. 남양분지와 장강 중류를 잇는 목이어서 ‘남북의 요충’으로 불렸다.\n삼국시대 제갈량이 은거한 융중이 근처에 있어, 유비의 삼고초려가 이 일대에서 이루어졌다. 219년 관우가 번성을 포위하고 한수 범람을 이용해 우금의 7군을 수몰시켰으나, 뒤를 오에게 찔려 패망했다. 남송 말 1268년 몽골군이 양양·번성을 포위하자 여문환이 6년 가까이 버텼다. 쿠빌라이는 일칸국에서 불러온 기술자가 만든 평형추 투석기(회회포)로 1273년 번성을 무너뜨렸고, 여문환도 항복했다. 양양을 잃은 남송은 한수-장강 물길이 열리면서 3년 만에 수도 임안을 내주었다.",tx:8,ty:-4,ta:'start'},
{t:'mtn',tier:3,x:528,y:255,n:'태산',h:'泰山 (1,545m)',e:'오악의 으뜸',d:"산동 중부, 화북평원 동쪽에 우뚝 솟은 해발 1,545m의 산. 오악 중 동악으로 ‘오악독존(五岳獨尊)’이라 새겨질 만큼 으뜸으로 여겨졌다. 해가 뜨는 동쪽에 있어 생명과 죽은 이의 혼을 함께 관장하는 산으로 믿어졌다.\n천하를 평정한 제왕이 하늘에 공을 고하는 봉선(封禪)을 이곳에서 올렸다. 진 시황, 한 무제, 후한 광무제, 당 고종·현종, 송 진종이 봉선을 거행했고, 청 강희제·건륭제도 여러 차례 올랐다. 『맹자』에는 공자가 태산에 올라 천하를 작게 여겼다는 말이 나오고, 두보는 「망악」에서 정상에 올라 뭇 산을 굽어보겠다는 포부를 노래했다. 정상까지 6,600여 개의 돌계단과 수많은 석각이 이어진다. 1987년 세계자연·문화복합유산에 올랐다."},
{t:'mtn',tier:3,x:413,y:245,n:'화산',h:'華山',e:'오악의 서악',d:"섬서 화음시, 진령 동쪽 끝에 솟은 오악의 서악(해발 2,154m). 화강암 봉우리 다섯이 연꽃처럼 둘러서 있으며, 깎아지른 절벽 때문에 ‘기이하고 험하기로 천하제일(奇險天下第一)’이라 불린다.\n예로부터 도교의 성지로, 진희이 등 많은 도사가 수행했다. 송을 세운 조광윤이 진희이와 내기 바둑을 두다 화산을 잃었다는 전설도 전한다. 벼랑에 쇠기둥과 판자를 박아 만든 장공잔도와 천척당 같은 험로가 유명하다. 중국의 옛 이름 ‘화하(華夏)’의 ‘화’가 이 산에서 왔다는 설이 있을 만큼 화하 문명과 깊이 얽힌 산으로 여겨진다. 김용 무협소설 속 ‘화산논검’의 무대이기도 하다."},
{t:'mtn',tier:3,x:466,y:275,n:'숭산',h:'嵩山',e:'오악의 중악',d:"하남 등봉시에 있는 오악의 중악(최고봉 해발 1,512m). 태실산과 소실산으로 이루어지며, 천하의 한가운데에 있다고 해서 중악이 되었다.\n495년 북위 효문제가 인도 승려 발타를 위해 소실산 기슭에 소림사를 세웠다. 이후 남인도에서 온 보리달마가 이곳 동굴에서 9년 동안 면벽 수행했다고 전해 선종의 발상지로 여겨진다. 수 말 소림사 승병이 이세민을 도와 왕세충을 친 공으로 당의 후원을 받았고, 소림 무술이 이름을 떨쳤다. 이 밖에 한대의 궐, 중국에서 가장 오래된 벽돌탑인 숭악사탑, 원대 곽수경의 관성대 등이 ‘천지지중 역사건축군’으로 세계문화유산에 등재되었다."},
{t:'mtn',tier:3,x:454,y:425,n:'형산',h:'衡山',e:'오악의 남악',d:"호남 형양 부근의 오악 중 남악(최고봉 축융봉 해발 1,300m). 72개 봉우리가 남북으로 늘어서 있으며, 사철 푸른 숲과 운해로 ‘오악 가운데 홀로 빼어나다(南岳獨秀)’는 말을 듣는다.\n불교와 도교가 한 산에서 공존하는 대표적인 명산이다. 당대 선승 남악 회양이 이곳에서 수행하며 마조 도일을 길러 남종선의 큰 줄기를 이루었다. 산기슭의 남악대묘는 남방 최대의 사당 건축으로, 동쪽에 도관 8곳, 서쪽에 사찰 8곳이 나란히 있다. 기러기가 이곳까지 날아왔다가 더 남쪽으로 가지 않고 돌아간다는 전설 때문에 첫 봉우리를 회안봉이라 부른다. 송대 주희와 장식이 함께 올라 시를 주고받기도 했다."},
{t:'mtn',tier:3,x:478,y:205,n:'항산',h:'恒山',e:'오악의 북악',d:"산서 혼원현의 오악 중 북악(최고봉 해발 2,016m). 중원과 북방 초원 사이의 산줄기에 자리해 예로부터 군사 요충이기도 했다.\n가장 유명한 것은 금룡협 절벽 중턱에 나무 기둥을 박아 매달듯 지은 현공사다. 북위 말 491년 무렵 처음 세워졌다고 전하며, 불교·도교·유교를 한 건물에 함께 모신 것이 특징이다. 이백이 이곳을 보고 ‘장관(壯觀)’ 두 글자를 남겼다는 이야기도 있다. 원래 북악 제사는 하북 곡양의 대무산에서 지냈으나, 청 순치제 때 이곳으로 옮겨 오면서 오늘날의 북악이 되었다."},
{t:'mtn',tier:3,x:163,y:275,n:'곤륜산맥',h:'崑崙山脈',e:'청장고원 북연',d:"파미르 고원에서 동쪽으로 약 2,500km 뻗어 청장고원의 북쪽 가장자리를 이루는 대산맥. 평균 해발 5,500m 이상으로, 타림분지와 티베트를 가르고 황하·장강의 발원지 부근까지 이어진다.\n중국 신화에서 곤륜은 천제가 사는 하늘의 도읍이자, 불사약을 가진 서왕모가 머무는 신선의 산이었다. 주 목왕이 팔준마를 몰고 곤륜에 가서 서왕모와 요지에서 잔치를 벌였다는 이야기가 『목천자전』에 전한다. 북쪽 기슭의 호탄(우전)은 곤륜에서 흘러내린 강에서 백옥·청옥을 캐는 옥의 산지로, 상대 부호묘의 옥기부터 청대 궁중 옥기까지 대부분이 이곳 화전옥으로 만들어졌다. 이 옥을 중원으로 나르던 길을 실크로드보다 앞선 ‘옥의 길’이라 부르기도 한다."},
{t:'mtn',tier:3,x:135,y:170,n:'천산',h:'天山',e:'2,500km',d:"신강 중부를 동서로 가로질러 키르기스스탄·카자흐스탄까지 약 2,500km 뻗은 산맥. 최고봉 토무르봉(승리봉)은 해발 7,439m다. 남쪽의 타림분지와 북쪽의 준가르 분지를 가르며, 눈과 빙하가 녹은 물이 기슭의 오아시스를 먹여 살린다.\n실크로드는 천산 남쪽 기슭을 따라 투루판·쿠차·아크수를 잇는 천산남로와, 북쪽 기슭을 따라 우루무치·이리를 거쳐 초원으로 가는 천산북로로 나뉘었다. 당은 남쪽에 안서도호부, 북쪽에 북정도호부를 두어 양쪽을 통제했다. 이백이 태어난 곳으로 알려진 쇄엽성(오늘날 키르기스스탄 토크마크 부근)도 천산 서쪽 기슭에 있다. 신강 천산 일대는 2013년 세계자연유산에 등재되었다."},
{t:'mtn',tier:3,x:475,y:225,n:'태행산맥',h:'太行山脈',e:'400km',d:"화북평원과 황토고원(산서고원) 사이를 남북으로 약 400km 달리는 산맥. 동쪽은 급한 절벽, 서쪽은 완만한 비탈이라 동쪽 평원에서 보면 거대한 벽처럼 솟아 있다. 산서·산동이라는 지명도 본래 이 일대 산을 기준으로 동서를 가른 데서 나왔다.\n산맥을 가로지르는 여덟 개의 협곡 통로 ‘태행팔형(太行八陘)’은 평원과 고원을 잇는 전략 요충이었다. 『열자』의 ‘우공이산(愚公移山)’ 우화에서 노인 우공이 옮기려 한 두 산 가운데 하나가 태행산이다. BC 260년 진과 조의 장평 대전도 태행산 서쪽 기슭에서 벌어졌다. 중일전쟁 때는 팔로군의 핵심 근거지였고, 1960년대 주민들이 절벽을 깎아 만든 홍기거 수로가 유명하다."},
{t:'mtn',tier:3,x:378,y:255,n:'진령',h:'秦嶺',e:'남북 지리 경계',d:"섬서 남부를 동서로 가로지르는 산맥으로, 주봉 태백산은 해발 3,771m다. 북쪽 기슭은 위수의 관중 평원, 남쪽은 한수의 한중분지다.\n회하와 함께 ‘진령-회하선’을 이루어 기후·농업·식생이 이곳을 경계로 뚜렷이 달라진다. 북쪽은 온대의 밀 농사, 남쪽은 아열대의 벼농사 지역이다. 관중과 촉을 잇는 험준한 장벽이어서 자오도·당락도·포사도·진창도 같은 잔도가 산을 넘었다. 유방은 한중으로 들어가며 잔도를 불태운 뒤 몰래 진창도로 나와 관중을 기습했고(명수잔도 암도진창), 제갈량은 이 산을 넘는 북벌을 거듭하다 234년 오장원 진중에서 숨졌다. 자이언트판다·황금원숭이·따오기가 사는 생태계의 보고이기도 하다."},
{t:'lake',tier:2,x:444,y:402,n:'동정호',h:'洞庭湖',e:'호남 · 2대 담수호',d:"호남 북부, 장강 남쪽의 거대한 호수. 상강·자강·원강·례강 네 물줄기를 받아 장강으로 내보내며, 장강의 홍수를 받아 주는 천연 저수지 역할을 한다. 한때 중국 최대의 담수호였으나 퇴적과 간척으로 줄어 지금은 파양호 다음이다.\n호수 북쪽을 호북, 남쪽을 호남이라 부르는 성 이름이 여기서 나왔다. 호수 동북쪽 악양의 악양루는 강남 3대 누각의 하나로, 두보는 「등악양루」를 지었고, 북송 범중엄은 「악양루기」에서 ‘천하의 근심은 먼저 근심하고 천하의 즐거움은 나중에 즐긴다’는 선비의 자세를 밝혔다. 호수 안의 군산은 순임금의 두 왕비가 묻혔다는 곳이며, 군산은침차가 난다. 굴원과 이백도 이 호수를 노래했다."},
{t:'lake',tier:2,x:513,y:402,n:'파양호',h:'鄱陽湖',e:'강서 · 최대 담수호',d:"강서 북부, 장강 남쪽에 있는 중국 최대의 담수호. 감강·무하·신강 등 강서의 물이 모여 호구에서 장강으로 빠진다. 우기에는 수면이 3천 km²를 넘지만 건기에는 크게 줄어드는 계절성 호수다.\n1363년 주원장과 진우량이 이 호수에서 36일에 걸친 대수전을 벌였다. 거대한 누선을 앞세운 진우량의 대군에 맞서 주원장은 화공으로 적선을 불태웠고, 진우량이 전사하면서 강남의 패권이 주원장에게 넘어갔다. 이 승리가 5년 뒤 명 건국의 기반이 되었다. 호숫가 여산에는 백거이·소식이 머물렀고, 주희가 부흥한 백록동서원이 있다. 겨울에는 시베리아흰두루미 등 수십만 마리의 철새가 모이는 세계적인 월동지다."},
{t:'lake',tier:2,x:585,y:355,n:'태호',h:'太湖',e:'강소·절강 · 3대 담수호',d:"강소 남부와 절강 북부 사이, 장강 삼각주 한가운데에 있는 약 2,400km²의 호수. 중국 5대 담수호의 하나로, 소주·무석·호주·상주 등 강남의 도시들이 호숫가를 둘러싸고 있다.\n춘추시대 오와 월이 이 호수를 사이에 두고 패권을 다투었으며, 월의 범려가 오를 멸한 뒤 서시와 함께 배를 타고 태호로 사라졌다는 전설이 있다. 물고기와 쌀이 풍부한 ‘어미지향(魚米之鄕)’으로 강남 번영의 기반이 되었다. 물에 깎여 구멍이 숭숭 뚫린 석회암 태호석은 정원 조경석의 으뜸으로 꼽혀, 북송 휘종은 화석강이라는 수송단을 만들어 개봉으로 실어 날랐다. 이 가혹한 징발은 방랍의 난을 부른 원인 중 하나가 되었다. 흰 물고기·흰 새우·뱅어의 ‘태호삼백’이 유명하다."}
];
const cities=document.getElementById('cn-cities'),mountains=document.getElementById('cn-mountains'),forts=document.getElementById('cn-forts');
// 모바일에서 마커도 살짝 키움
const M=isMobile?1.25:1;
const styles={cap:{fill:'#b85450',r:6.5*M,tsize:12.5,tw:700,tc:'#3a1810'},city:{fill:'#d97e3a',r:4.8*M,tsize:11,tw:600,tc:'#5a3210'},silk:{fill:'#3a9080',r:4.5*M,tsize:11,tw:600,tc:'#0e5c4a'},fort:{fill:'#5a4a70',r:0,tsize:10.5,tw:700,tc:'#2a1e40'},mtn:{fill:'#7a6a45',r:0,tsize:10,tw:600,tc:'#4d3f22'},lake:{fill:'#7ba8c9',r:0,tsize:10,tw:600,tc:'#2a5f80'}};
const SHAPE=isMobile?7.5:6;  // fort/mtn 도형 크기
ITEMS.forEach(c=>{
  const ll=CITY_LL[c.n]; if(ll){const p=LL(ll[0],ll[1]);c.x=p[0];c.y=p[1];}
  const s=styles[c.t],g=group(c,c.tier);
  if(c.t==='mtn')g.appendChild(el('path',{d:`M ${c.x-SHAPE-1},${c.y+5} L ${c.x},${c.y-SHAPE-1} L ${c.x+SHAPE+1},${c.y+5} Z`,fill:s.fill,stroke:'#fff','stroke-width':1}));
  else if(c.t==='lake')g.appendChild(el('ellipse',{cx:c.x,cy:c.y,rx:10*M,ry:5*M,fill:s.fill,stroke:'#fff','stroke-width':1,opacity:0.85}));
  else if(c.t==='fort')g.appendChild(el('path',{d:`M ${c.x},${c.y-SHAPE} L ${c.x+SHAPE},${c.y} L ${c.x},${c.y+SHAPE} L ${c.x-SHAPE},${c.y} Z`,fill:s.fill,stroke:'#fff','stroke-width':1.4,filter:'url(#cn-shadow)'}));
  else g.appendChild(el('circle',{cx:c.x,cy:c.y,r:s.r,fill:s.fill,stroke:'#fff','stroke-width':1.7,filter:'url(#cn-shadow)'}));
  g.appendChild(txt(c.x+(c.tx||8),c.y+(c.ty||4),c.n,{size:s.tsize,weight:s.tw,color:s.tc,anchor:c.ta,'stroke-width':2.8}));
  if(c.t==='mtn'||c.t==='lake')mountains.appendChild(g);
  else if(c.t==='fort')forts.appendChild(g);
  else cities.appendChild(g);
});

const panel=document.getElementById('cn-panel'),pName=document.getElementById('cn-p-name'),pHan=document.getElementById('cn-p-han'),pTags=document.getElementById('cn-p-tags'),pDesc=document.getElementById('cn-p-desc');
const typeLabel={cap:'도읍',city:'주요 도시',silk:'실크로드 관문',fort:'성·관문',mtn:'산·산맥',lake:'호수',river:'강',wall:'구조물',terrain:'지형',sea:'바다','':'지역'};
function openPanel(el){
  const d=el.dataset;
  pName.textContent=d.name||'';pHan.textContent=d.han||'';
  let ttype=d.type;
  if(!ttype){const layer=el.closest('.cn-layer')?.dataset.layer;if(layer==='rivers')ttype='river';else if(layer==='wall')ttype='wall';else if(layer==='terrain')ttype='terrain';else if(layer==='seas')ttype='sea';}
  pTags.innerHTML=`<span class="tag">${typeLabel[ttype]||''}</span>${d.era?`<span class="tag era">${d.era}</span>`:''}`;
  pDesc.textContent=d.desc||'';panel.classList.add('show');
  if(isMobile){panel.scrollTop=0;document.getElementById('cn-wrap').classList.add('sheet-open');}
}
// 정적 SVG 항목(본토·해남도·대만)에도 키보드 접근성 부여
document.querySelectorAll('#cn-viewport>.cn-item').forEach(it=>{
  if(!it.hasAttribute('tabindex'))it.setAttribute('tabindex','0');
  if(!it.hasAttribute('role'))it.setAttribute('role','button');
  if(!it.hasAttribute('aria-label')){const d=it.dataset;it.setAttribute('aria-label',(d.name||'')+(d.han?', '+d.han:''));}
});
let lastFocusedItem=null;
let openedByKey=false;
function openPanelFrom(it){lastFocusedItem=it;openPanel(it);const c=document.getElementById('cn-close');if(c&&openedByKey)setTimeout(()=>c.focus({preventScroll:true}),0);openedByKey=false;}
function closePanel(){panel.classList.remove('show');document.getElementById('cn-wrap').classList.remove('sheet-open');if(lastFocusedItem){if(document.activeElement&&panel.contains(document.activeElement)){try{lastFocusedItem.focus({preventScroll:true});}catch(_){}}lastFocusedItem=null;}}

document.getElementById('cn-viewport').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const it=e.target.closest('.cn-item');if(it){e.preventDefault();openedByKey=true;openPanelFrom(it);}});
document.getElementById('cn-close').addEventListener('click',closePanel);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('show'))closePanel();});

// 모바일 하단 시트 스와이프 다운으로 닫기
if(isMobile){
  let sheetY0=0,sheetDy=0,sheetDragging=false;
  panel.addEventListener('touchstart',e=>{if(panel.scrollTop>0)return;sheetY0=e.touches[0].clientY;sheetDragging=true;sheetDy=0;},{passive:true});
  panel.addEventListener('touchmove',e=>{if(!sheetDragging)return;sheetDy=e.touches[0].clientY-sheetY0;if(sheetDy>0){panel.style.transform=`translateY(${sheetDy}px)`;}},{passive:true});
  panel.addEventListener('touchend',()=>{if(!sheetDragging)return;sheetDragging=false;panel.style.transform='';if(sheetDy>80){panel.classList.remove('show');document.getElementById('cn-wrap').classList.remove('sheet-open');}});
}

// 컨트롤 토글 (모바일)
const toggle=document.getElementById('cn-toggle'),controls=document.getElementById('cn-controls');
toggle.addEventListener('click',()=>{
  const open=controls.classList.toggle('open');
  toggle.classList.toggle('open',open);
  toggle.textContent=open?'컨트롤 닫기':'컨트롤 열기';
  toggle.setAttribute('aria-expanded',open);
  // 토글에 화살표 아이콘 다시 붙이기 위해 pseudo 사용중이므로 텍스트만
});

// 왕조 메타데이터. 강역 path는 상단 GEO_DYN을 단일 출처로 참조(중복 제거)
const DYN_META={
qin:{n:'秦 진',c:'#a89670',y:'BC 221 ~ 206 · 15년',d:'BC 221년 진왕 정이 한·조·위·초·연·제 6국을 차례로 멸하고 최초의 통일 제국을 세운 뒤 스스로 ‘시황제’라 칭했다. 봉건제 대신 전국을 36군으로 나눠 중앙에서 관리를 보내는 군현제를 시행했다.\n문자를 소전으로, 도량형·화폐·수레바퀴 폭을 통일해 하나의 제국을 만드는 기반을 닦았다. 몽염을 보내 흉노를 몰아내고 옛 성벽을 이어 만리장성을 쌓았으며, 영남을 정벌하고 직도·치도를 놓았다. 그러나 법가에 따른 가혹한 통치와 분서갱유, 아방궁·여산릉 공사에 백성이 지쳤다. BC 210년 시황제가 순행 중 죽자 진승·오광의 난을 시작으로 반란이 번졌고, BC 206년 진왕 자영이 유방에게 항복하며 15년 만에 멸망했다. 짧았지만 황제 제도와 중앙집권 체제는 2천 년 동안 이어졌다.'},
han:{n:'漢 한',c:'#b85450',y:'BC 202 ~ AD 220',d:'진 멸망 후 초의 항우와 다툰 유방이 BC 202년 해하 전투에서 승리하고 장안에 도읍해 세웠다. 초기에는 군현제와 봉건제를 섞은 군국제를 폈고, 문제·경제 때 백성을 쉬게 하는 정책으로 국력을 쌓았다.\n무제 때 전성기를 맞아 위청·곽거병이 흉노를 북쪽으로 몰아냈고, 장건의 서역 사행으로 실크로드가 열렸다. 하서사군과 서역도호부를 두었고, 남월과 위만조선을 멸해 한사군을 설치했다. 동중서의 건의로 유학을 국가 이념으로 삼고 태학을 세웠다. 외척 왕망의 신(8~23)으로 잠시 끊겼다가 광무제 유수가 낙양에 후한을 재건했다. 후한 때 채륜이 종이 제조법을 개량했으나, 환관과 외척의 다툼, 184년 황건적의 난으로 무너져 220년 조비에게 선양했다. 400여 년의 통일은 ‘한족’·‘한자’라는 이름으로 남았다.'},
tang:{n:'唐 당',c:'#d4a017',y:'618 ~ 907 · 290년',d:'수 말의 혼란 속에서 태원유수 이연이 617년 거병해 이듬해 장안에서 세웠다. 둘째 아들 이세민은 현무문의 변(626)으로 즉위해 ‘정관의 치’를 이루었다.\n태종과 고종 때 동돌궐·고창·서돌궐·백제·고구려를 무너뜨려 최대 판도를 이루었고, 여러 도호부를 두어 변경을 다스렸다. 율령과 3성 6부, 균전제·조용조·부병제로 정비된 제도는 신라와 일본에 큰 영향을 주었다. 무측천이 잠시 주(周)를 세우기도 했다. 현종 전반기 ‘개원의 치’ 때 장안은 국제도시로 번영했고, 이백·두보·왕유가 활약했다. 그러나 755년 안사의 난으로 국력이 기울고 절도사가 할거했으며, 875년 황소의 난 이후 907년 절도사 주전충에게 나라를 빼앗겼다.'},
nsong:{n:'北宋 북송',c:'#4a8ea8',y:'960 ~ 1127 · 167년',d:'960년 후주의 장군 조광윤이 진교역에서 부하들에게 추대되어 개봉에 세웠다. 무인 집권의 폐해를 막으려 절도사의 병권을 거두고, 과거로 뽑은 문관이 다스리는 문치주의를 확립했다.\n상업과 도시가 크게 발달해 개봉은 인구 100만의 대도시가 되었고, 세계 최초의 지폐 교자가 쓰였다. 활판 인쇄, 나침반의 항해 이용, 화약 무기가 이 시기에 발전했다. 사대부 문화가 꽃피어 구양수·소식·사마광이 활약했고, 주돈이·정호·정이가 성리학의 기틀을 놓았다. 그러나 연운16주를 가진 요와 서북의 서하에 막대한 세폐를 바쳤고, 재정난을 타개하려던 왕안석의 신법은 당쟁만 격화시켰다. 금과 손잡고 요를 멸했으나 곧 금의 침입을 받아 1127년 정강의 변으로 멸망했다.'},
ssong:{n:'南宋 남송',c:'#7a5aa8',y:'1127 ~ 1279 · 152년',d:'정강의 변 때 사로잡히지 않은 흠종의 동생 조구(고종)가 1127년 즉위해 남쪽으로 옮겨, 1138년 임안(항주)을 사실상의 수도로 삼았다. 악비 등이 금에 맞서 북진했으나, 1141년 진회가 주도한 소흥화의로 회하-진령선을 국경으로 정하고 금에 신하의 예를 갖췄다.\n영토는 줄었지만 강남의 벼농사와 해상 무역으로 경제는 오히려 번성했고, 천주·광주·명주가 세계적인 항구가 되었다. 주희가 성리학을 집대성해 이후 동아시아의 지배 사상이 되었다. 몽골이 금을 멸한 뒤 남송을 공격하자 사천의 산성과 양양에서 40년 넘게 저항했다. 1276년 임안이 함락되고, 1279년 애산 해전에서 육수부가 어린 황제를 업고 바다에 뛰어들며 멸망했다. 끝까지 항복을 거부한 문천상은 「정기가」를 남기고 처형되었다.'},
yuan:{n:'元 원',c:'#3a5a80',y:'1271 ~ 1368 · 97년',d:'칭기즈 칸의 손자 쿠빌라이가 1271년 『역경』에서 딴 ‘대원’을 국호로 삼고 대도(북경)를 수도로 정했다. 1279년 남송을 멸하며 이민족 최초로 중국 전역을 통일했다.\n몽골 제국의 일부로 유라시아가 하나의 교역망으로 묶인 ‘팍스 몽골리카’ 시대에 역참과 교초(지폐)가 널리 쓰였고, 마르코 폴로 같은 서방인이 오갔다. 대운하를 대도까지 곧장 이었고, 곽수경이 수시력을 만들었다. 몽골인·색목인·한인·남인의 차별적 신분 질서를 두었고, 파스파 문자를 제정했다. 고려와 부마 관계를 맺고 일본 원정을 두 차례(1274·1281) 단행했으나 실패했다. 제위 다툼과 교초 남발, 황하 범람이 겹쳐 1351년 홍건적의 난이 일어났고, 1368년 명군에 쫓겨 대도를 버리고 몽골고원으로 물러났다(북원).'},
ming:{n:'明 명',c:'#d97e3a',y:'1368 ~ 1644 · 276년',d:'홍건군 출신의 주원장이 경쟁자들을 물리치고 1368년 남경에서 세웠다(홍무제). 재상제를 폐지하고 황제가 6부를 직접 거느리는 강력한 체제를 만들었으며, 이갑제와 해금 정책을 시행했다.\n조카 건문제를 몰아낸 영락제는 1421년 북경으로 천도해 자금성을 지었고, 몽골을 다섯 차례 친정했으며, 환관 정화에게 대선단을 맡겨 일곱 차례 원정(1405~1433)을 보냈다. 1449년 토목의 변 이후 수세로 돌아서 만리장성을 벽돌로 다시 쌓았다. 16세기에는 은이 대량 유입되며 일조편법이 시행되었고, 왕양명의 양명학이 등장했다. 임진왜란 때 조선에 원군을 보냈으나 재정이 악화되었다. 환관 전횡과 당쟁, 후금의 압박 속에 1644년 이자성의 농민군이 북경을 함락하자 숭정제가 자결하며 멸망했다.'},
qing:{n:'淸 청',c:'#4a7a4a',y:'1644 ~ 1912 · 268년',d:'누르하치가 여진 부족을 통합해 1616년 후금을 세웠고, 홍타이지가 1636년 국호를 청으로 바꿨다. 1644년 오삼계가 산해관을 열자 입관해 북경을 수도로 삼고 중국 전역을 장악했다.\n강희·옹정·건륭 3대 130여 년의 전성기에 삼번의 난 진압, 대만(1683) 편입, 몽골·티베트 복속, 준가르 평정과 신강 설치(1759)로 역대 최대의 영토를 확보했다. 소수의 만주족이 변발을 강요하는 한편 과거와 한족 관료를 함께 쓰는 만한병용으로 다스렸고, 『사고전서』를 편찬했다. 그러나 19세기 인구 폭증과 부패 속에 아편전쟁(1840)으로 서구 열강에 문을 열었고, 태평천국 운동, 청일전쟁 패배, 의화단 사건이 이어졌다. 1911년 신해혁명으로 이듬해 선통제 부의가 퇴위하며 2천 년 황제 체제가 막을 내렸다.'}
};
const DYN={};
for(const k in DYN_META){DYN[k]={...DYN_META[k],p:GEO_DYN[k]};}
const dynLayer=document.getElementById('cn-dynasty'),dynInfo=document.getElementById('cn-dyn-info');
const compareBtn=document.getElementById('cn-dyn-compare');
let compareMode=false;
const selected=[];  // 선택된 왕조 키 배열(순서 유지). 단일 모드에서는 최대 1개.

function dynBtn(k){return document.querySelector(`.cn-dyn-bar button[data-dyn="${k}"]`);}

function renderOverlays(){
  // 강역 path 다시 그리기
  dynLayer.innerHTML='';
  selected.forEach(k=>{
    const D=DYN[k];
    dynLayer.appendChild(el('path',{d:D.p,fill:D.c,stroke:D.c,'stroke-width':2,opacity:compareMode?0.32:0.42}));
  });
  // 버튼 스타일
  document.querySelectorAll('.cn-dyn-bar button[data-dyn]').forEach(x=>{
    const key=x.dataset.dyn;
    if(key==='none'){const active=selected.length===0;x.style.background=active?'#3a3226':'';x.style.color=active?'#f5efe0':'';x.style.borderColor='';x.setAttribute('aria-pressed',active);return;}
    const on=selected.includes(key);
    x.style.background=on?DYN[key].c:'';x.style.color=on?'#fff':'';x.style.borderColor=on?DYN[key].c:'';x.setAttribute('aria-pressed',on);
  });
  // 정보 패널
  if(selected.length===0){dynInfo.classList.remove('show');dynInfo.innerHTML='';}
  else{
    dynInfo.innerHTML=selected.map(k=>{const D=DYN[k];
      return `<div style="margin-bottom:8px"><span style="display:inline-block;width:11px;height:11px;border-radius:2px;background:${D.c};margin-right:6px;vertical-align:middle"></span><b>${D.n}</b><span class="yr">${D.y}</span><div style="margin-top:4px">${D.d.replace(/\n/g,'<br>')}</div></div>`;
    }).join('');
    dynInfo.classList.add('show');
  }
}

document.querySelectorAll('.cn-dyn-bar button[data-dyn]').forEach(b=>{
  b.setAttribute('aria-pressed','false');
  b.addEventListener('click',()=>{
    const k=b.dataset.dyn;
    if(k==='none'){selected.length=0;}
    else if(compareMode){
      const i=selected.indexOf(k);
      if(i>=0)selected.splice(i,1); else selected.push(k);  // 토글
    } else {
      // 단일 모드: 같은 것 누르면 해제, 아니면 교체
      if(selected.length===1&&selected[0]===k)selected.length=0;
      else{selected.length=0;selected.push(k);}
    }
    renderOverlays();
  });
});

compareBtn.addEventListener('click',()=>{
  compareMode=!compareMode;
  compareBtn.setAttribute('aria-pressed',compareMode);
  compareBtn.textContent=compareMode?'비교 종료':'겹쳐 비교';
  // 비교 모드를 끄면 선택을 가장 최근 1개만 남김
  if(!compareMode&&selected.length>1)selected.splice(0,selected.length-1);
  renderOverlays();
});
renderOverlays();
document.querySelectorAll('.cn-toolbar button[data-layer]').forEach(b=>{
  b.addEventListener('click',()=>{const on=b.classList.toggle('active');b.setAttribute('aria-pressed',on);const key=b.dataset.layer;document.querySelectorAll(`.cn-layer[data-layer="${key}"]`).forEach(g=>{g.style.display=on?'':'none';});});
});
// 범례 접기/펴기
const legend=document.getElementById('cn-legend'),legendToggle=document.getElementById('cn-legend-toggle');
// 좁은 화면에서는 범례가 지도를 가리지 않도록 접힌 상태로 시작
if(legend&&legendToggle&&matchMedia('(max-width:900px)').matches){legend.classList.add('hidden');legendToggle.setAttribute('aria-expanded','false');legendToggle.textContent='범례 열기';}
if(legendToggle){legendToggle.addEventListener('click',()=>{const hidden=legend.classList.toggle('hidden');legendToggle.setAttribute('aria-expanded',!hidden);legendToggle.textContent=hidden?'범례 열기':'범례 닫기';});}
const wrap=document.getElementById('cn-wrap');
document.querySelectorAll('.cn-mode-bar button').forEach(b=>{
  b.addEventListener('click',()=>{document.querySelectorAll('.cn-mode-bar button').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false');});b.classList.add('active');b.setAttribute('aria-pressed','true');wrap.classList.remove('mode-core','mode-std','mode-detail');wrap.classList.add('mode-'+b.dataset.mode);});
});

// 모바일 초기 라벨 밀도: 핵심으로 시작해 화면 깔끔하게
if(isMobile){
  document.querySelectorAll('.cn-mode-bar button').forEach(x=>x.classList.remove('active'));
  const coreBtn=document.querySelector('.cn-mode-bar button[data-mode="core"]');
  if(coreBtn){coreBtn.classList.add('active');wrap.classList.remove('mode-detail');wrap.classList.add('mode-core');}
}

const svg=document.getElementById('cn-svg');
const MAP={w:800,h:560};  // 지도 콘텐츠 기준 크기
let vx=0,vy=0,vw=800,vh=560;
let fitW=800,fitH=560;    // 컨테이너 비율에 맞춘 전체 보기 크기(줌아웃 한계)
const MIN_W=60;           // 최대 확대 한계
// 뷰 보정: 비율 고정, 줌 범위 제한, 지도가 화면 밖으로 밀려나지 않도록 중심 제한
function clampView(){
  const asp=fitW/fitH;
  vw=Math.max(MIN_W,Math.min(fitW,vw)); vh=vw/asp;
  let cx=vx+vw/2, cy=vy+vh/2;
  const x0=Math.min(vw/2,MAP.w/2), x1=Math.max(MAP.w-vw/2,MAP.w/2);
  const y0=Math.min(vh/2,MAP.h/2), y1=Math.max(MAP.h-vh/2,MAP.h/2);
  cx=Math.max(x0,Math.min(x1,cx)); cy=Math.max(y0,Math.min(y1,cy));
  vx=cx-vw/2; vy=cy-vh/2;
}
function setView(){clampView();svg.setAttribute('viewBox',`${vx} ${vy} ${vw} ${vh}`);}
function computeFit(){
  const r=svg.getBoundingClientRect();
  if(!r.width||!r.height)return false;
  const cAsp=r.width/r.height, mAsp=MAP.w/MAP.h;
  if(cAsp<mAsp){fitW=MAP.w; fitH=MAP.w/cAsp;} else {fitH=MAP.h; fitW=MAP.h*cAsp;}
  return true;
}
// 전체 보기로 초기화
function fitView(){computeFit(); vw=fitW; vh=fitH; vx=(MAP.w-vw)/2; vy=(MAP.h-vh)/2; setView();}
// 크기 변화 시: 사용자의 확대 배율과 중심을 유지한 채 비율만 다시 맞춤(리셋하지 않음)
function refit(){
  const k=vw/fitW, cx=vx+vw/2, cy=vy+vh/2;
  if(!computeFit())return;
  vw=fitW*k; vh=fitH*k; vx=cx-vw/2; vy=cy-vh/2; setView();
}
function zoomAt(cx,cy,k){vw*=k;vh*=k;vx=cx-vw/2;vy=cy-vh/2;setView();}
document.getElementById('cn-in').addEventListener('click',()=>zoomAt(vx+vw/2,vy+vh/2,0.7));
document.getElementById('cn-out').addEventListener('click',()=>zoomAt(vx+vw/2,vy+vh/2,1/0.7));
document.getElementById('cn-reset').addEventListener('click',fitView);
fitView();
if(window.ResizeObserver){let rq=0;new ResizeObserver(()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(refit);}).observe(svg);}
else window.addEventListener('resize',refit);

// 팬 + 핀치줌
// 포인터 캡처는 실제 드래그가 시작될 때만 건다. (pointerdown에서 캡처하면 PC에서 click 대상이 svg로 바뀌어 항목 클릭이 먹통이 됨)
let mightDrag=false,dragging=false,justDragged=false,sx=0,sy=0,startVx=0,startVy=0,downItem=null;
const pointers=new Map();let pinchDist=0,pinchCx=0,pinchCy=0;
function getSvgCoord(cx,cy){const r=svg.getBoundingClientRect();return{x:vx+(cx-r.left)/r.width*vw,y:vy+(cy-r.top)/r.height*vh};}
function capture(id){try{if(!svg.hasPointerCapture(id))svg.setPointerCapture(id);}catch(_){}}
svg.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){mightDrag=true;dragging=false;justDragged=false;sx=e.clientX;sy=e.clientY;startVx=vx;startVy=vy;downItem=e.target.closest?e.target.closest('.cn-item'):null;}
  else if(pointers.size===2){mightDrag=false;downItem=null;const pts=[...pointers.values()];pinchDist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};const sp=getSvgCoord(mid.x,mid.y);pinchCx=sp.x;pinchCy=sp.y;pointers.forEach((_,id)=>capture(id));}
});
svg.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const pts=[...pointers.values()];const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    if(pinchDist>0&&d>0){const k=pinchDist/d;vw*=k;vh*=k;const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};const r=svg.getBoundingClientRect();clampView();vx=pinchCx-(mid.x-r.left)/r.width*vw;vy=pinchCy-(mid.y-r.top)/r.height*vh;setView();}
    pinchDist=d;justDragged=true;return;
  }
  if(!mightDrag)return;
  const dx=Math.abs(e.clientX-sx),dy=Math.abs(e.clientY-sy);
  if(!dragging&&dx+dy>6){dragging=true;svg.classList.add('dragging');capture(e.pointerId);}
  if(dragging){const r=svg.getBoundingClientRect();const scale=vw/r.width;vx=startVx-(e.clientX-sx)*scale;vy=startVy-(e.clientY-sy)*scale;setView();}
});
function endPtr(e){
  if(!pointers.has(e.pointerId))return;
  pointers.delete(e.pointerId);
  if(dragging)justDragged=true;
  if(pointers.size<2)pinchDist=0;
  if(pointers.size===0){mightDrag=false;dragging=false;svg.classList.remove('dragging');}
  try{if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);}catch(_){}
}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();const p=getSvgCoord(e.clientX,e.clientY);const k=e.deltaY<0?0.85:1/0.85;vw*=k;vh*=k;clampView();const r=svg.getBoundingClientRect();vx=p.x-(e.clientX-r.left)/r.width*vw;vy=p.y-(e.clientY-r.top)/r.height*vh;setView();},{passive:false});

// 클릭: 항목이면 상세 열기, 빈 곳 더블클릭/더블탭이면 확대
let lastTap=0;
svg.addEventListener('click',e=>{
  if(justDragged){justDragged=false;return;}
  const it=(e.target.closest&&e.target.closest('.cn-item'))||downItem;
  downItem=null;
  if(it){lastTap=0;openPanelFrom(it);return;}
  const now=Date.now();
  if(now-lastTap<300){const p=getSvgCoord(e.clientX,e.clientY);zoomAt(p.x,p.y,0.6);lastTap=0;}
  else lastTap=now;
});


// ===== 지명 검색 =====
(function initSearch(){
  const input=document.getElementById('cn-search'),list=document.getElementById('cn-search-list');
  if(!input||!list)return;
  // 현대 중국어 발음·별칭으로도 찾을 수 있게
  const ALIAS={'장안·함양':'서안 시안 함양','낙양':'뤄양 낙읍','개봉':'카이펑 변경 동경 대량','북경':'베이징 대도 중도 연경 북평 칸발릭','남경':'난징 건강 건업 금릉','항주':'항저우 임안','성도':'청두 익주','평성·대동':'다퉁','업성':'업','심양·성경':'선양 봉천 무크덴','은허':'안양 인쉬','소주':'쑤저우 고소','중경':'충칭','형주·무한':'우한 징저우 강릉 무창 한구','광주':'광저우 번우 캔톤','태원':'타이위안 진양','란주':'란저우 금성','장사':'창사 마왕퇴','곡부':'취푸 공자','양주':'양저우 강도','천주':'취안저우 자이툰','대리':'다리 남조','라싸':'티베트 토번','상해':'상하이','돈황':'둔황 막고굴','하미':'이오','우루무치':'적화','카슈가르':'카스 소륵','투루판':'고창','가욕관':'자위관','산해관':'산하이관','황하':'황허','장강 (양자강)':'창장 양쯔강 양자강','한수 (한강)':'한장','대운하':'경항운하','청장고원':'티베트고원','만리장성':'장성','실크로드':'비단길','대만':'타이완','해남도':'하이난','남중국해':'남해','동중국해':'동해'};
  const norm=s=>(s||'').toLowerCase().replace(/[\s·・()\[\]\-,.'"]/g,'');
  const layerCat={cities:'도시',forts:'성·관문',rivers:'강·운하',terrain:'지형',mountains:'산·호수',wall:'장성·길',seas:'바다'};
  const catOf=g=>{const t=g.dataset.type;if(t&&typeLabel[t])return typeLabel[t];const l=g.closest('.cn-layer');return l?(layerCat[l.dataset.layer]||'지역'):'지리';};
  // 검색 색인: 지도 항목 + 왕조
  const index=[];
  document.querySelectorAll('#cn-viewport .cn-item').forEach(g=>{
    const n=g.dataset.name||'';if(!n)return;
    index.push({kind:'item',el:g,name:n,sub:g.dataset.han||'',cat:catOf(g),key:norm(n),alt:norm((g.dataset.han||'')+' '+(ALIAS[n]||''))});
  });
  Object.keys(DYN).forEach(k=>{
    const D=DYN[k];
    index.push({kind:'dyn',k,name:D.n+' 왕조',sub:D.y,cat:'왕조',key:norm(D.n),alt:norm(D.n.replace(/\s/g,'')+'나라 '+D.n.split(' ')[1]+'나라')});
  });
  let results=[],active=-1;
  function score(e,q){
    if(e.key===q)return 0;
    if(e.key.startsWith(q))return 1;
    if(e.key.includes(q))return 2;
    if(e.alt.includes(q))return 3;
    return -1;
  }
  function render(){
    list.innerHTML='';
    const q=norm(input.value);
    if(!q){close();return;}
    results=index.map(e=>({e,s:score(e,q)})).filter(x=>x.s>=0)
      .sort((a,b)=>a.s-b.s||a.e.name.length-b.e.name.length).slice(0,10).map(x=>x.e);
    if(!results.length){
      const li=document.createElement('li');li.className='empty';li.textContent='검색 결과가 없습니다';li.setAttribute('aria-disabled','true');list.appendChild(li);
    }
    results.forEach((e,i)=>{
      const li=document.createElement('li');li.id='cn-sr-'+i;li.setAttribute('role','option');li.setAttribute('aria-selected','false');
      const nm=document.createElement('span');nm.className='nm';nm.textContent=e.name;
      const sub=document.createElement('span');sub.className='sub';sub.textContent=e.sub;
      const cat=document.createElement('span');cat.className='cat';cat.textContent=e.cat;
      li.append(nm,sub,cat);
      li.addEventListener('mousedown',ev=>ev.preventDefault());  // 입력창 포커스 유지(클릭 전 목록이 닫히지 않게)
      li.addEventListener('click',()=>choose(i));
      list.appendChild(li);
    });
    active=results.length?0:-1;highlight();
    list.hidden=false;input.setAttribute('aria-expanded','true');
  }
  function highlight(){
    [...list.querySelectorAll('li[role="option"]')].forEach((li,i)=>li.setAttribute('aria-selected',i===active?'true':'false'));
    if(active>=0){input.setAttribute('aria-activedescendant','cn-sr-'+active);const li=document.getElementById('cn-sr-'+active);if(li&&li.scrollIntoView)li.scrollIntoView({block:'nearest'});}
    else input.removeAttribute('aria-activedescendant');
  }
  function close(){list.hidden=true;list.innerHTML='';results=[];active=-1;input.setAttribute('aria-expanded','false');input.removeAttribute('aria-activedescendant');}
  function focusItem(g){
    // 해당 레이어가 꺼져 있으면 켠다
    const layer=g.closest('.cn-layer');
    if(layer&&layer.style.display==='none'){const b=document.querySelector(`.cn-toolbar button[data-layer="${layer.dataset.layer}"]`);if(b)b.click();}
    let bb=null;try{bb=g.getBBox();}catch(_){}
    if(bb&&(bb.width>0||bb.height>0)){
      const asp=fitW/fitH;
      const w=Math.max(bb.width*1.8,bb.height*1.8*asp,fitW*0.35);
      vw=Math.min(w,fitW);vh=vw/asp;
      vx=bb.x+bb.width/2-vw/2;vy=bb.y+bb.height/2-vh/2;
      setView();
    }
    g.classList.remove('cn-found');void g.getBoundingClientRect();g.classList.add('cn-found');
    setTimeout(()=>g.classList.remove('cn-found'),1900);
  }
  function choose(i){
    const e=results[i];if(!e)return;
    input.value=e.kind==='dyn'?e.name:e.name;
    close();input.blur();
    if(e.kind==='item'){focusItem(e.el);openPanelFrom(e.el);}
    else{
      if(!selected.includes(e.k)){const b=dynBtn(e.k);if(b)b.click();}
      if(dynInfo.scrollIntoView)dynInfo.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
  }
  input.addEventListener('input',render);
  input.addEventListener('focus',()=>{if(input.value)render();});
  input.addEventListener('blur',()=>setTimeout(close,120));
  input.addEventListener('keydown',e=>{
    if(e.isComposing||e.keyCode===229)return;  // 한글 조합 중에는 무시
    if(e.key==='ArrowDown'){if(list.hidden)render();else if(results.length){active=(active+1)%results.length;highlight();}e.preventDefault();}
    else if(e.key==='ArrowUp'){if(results.length){active=(active-1+results.length)%results.length;highlight();}e.preventDefault();}
    else if(e.key==='Enter'){if(list.hidden)render();if(results.length)choose(active<0?0:active);e.preventDefault();}
    else if(e.key==='Escape'){if(!list.hidden){close();e.stopPropagation();}}
  });
})();

})();
</script>
